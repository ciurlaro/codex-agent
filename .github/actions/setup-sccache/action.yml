name: Setup sccache
description: Install and integrity-check the pinned Rust compiler cache.
inputs:
  write:
    description: Request a write from the one elected authoritative PR merge-ref lane.
    default: "false"
outputs:
  cargo-main-cache-key:
    value: ${{ steps.policy.outputs.cargo-main-key }}
runs:
  using: composite
  steps:
    - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      with:
        version: v0.17.0
    - name: Verify the pinned binary and configure its GHA backend
      env:
        ALLOW_WRITE: ${{ inputs.write }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      shell: bash
      run: |
        expected=""
        case "$RUNNER_OS/$RUNNER_ARCH" in
          macOS/ARM64) expected=af205fcb0fbca2b051dd293f8a96d3177cfb74b06324a948d7ee7dbadf367b78 ;;
          Linux/X64) expected=066c5a84c85044c8f48b3ab571ac114293ea717c3d36985db022af8206e21e63 ;;
        esac
        if [ -n "$expected" ]; then
          actual=$(openssl dgst -sha256 "$(command -v sccache)" | awk '{print $NF}')
          test "$actual" = "$expected"
        fi
        mode=READ_ONLY
        if [ "$ALLOW_WRITE" = true ] && [ "$GITHUB_EVENT_NAME" = pull_request ] && \
          [ -n "$PR_NUMBER" ] && [ "$GITHUB_REF" = "refs/pull/$PR_NUMBER/merge" ]; then
          mode=READ_WRITE
        fi
        {
          printf 'SCCACHE_GHA_ENABLED=true\n'
          printf 'SCCACHE_GHA_VERSION=codex-agent-rust-v1\n'
          printf 'SCCACHE_GHA_RW_MODE=%s\n' "$mode"
          printf 'RUSTC_WRAPPER=sccache\n'
          printf 'CARGO_INCREMENTAL=0\n'
        } >> "$GITHUB_ENV"
        dependency_hash="${{ hashFiles('codex-agent-runtime-ios/native/provenance.json', 'codex-agent-runtime-ios/native/patches/**') }}"
        {
          printf 'write=%s\n' "$([ "$mode" = READ_WRITE ] && printf true || printf false)"
          printf 'cargo-main-key=cargo-main-dependencies-v1-%s-%s-%s\n' \
            "$RUNNER_OS" "$RUNNER_ARCH" "$dependency_hash"
          printf 'cargo-pr-key=cargo-pr-dependencies-v1-%s-%s-%s-%s\n' \
            "$RUNNER_OS" "$RUNNER_ARCH" "$dependency_hash" "$PR_NUMBER"
        } >> "$GITHUB_OUTPUT"
      id: policy
    - id: cargo-main-read
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
        key: ${{ steps.policy.outputs.cargo-main-key }}
    - id: cargo-pr-read
      if: steps.policy.outputs.write != 'true' && github.event_name == 'pull_request'
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
        key: ${{ steps.policy.outputs.cargo-pr-key }}
    - id: cargo-pr-write
      if: steps.policy.outputs.write == 'true'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
        key: ${{ steps.policy.outputs.cargo-pr-key }}
