name: Setup Kotlin build
description: Install pinned build tools and restore read-only-safe Gradle and Konan caches.
inputs:
  cache-read-only:
    description: Prevent this job from writing the shared Gradle cache.
    default: "true"
  cache-encryption-key:
    description: Encryption key for Gradle configuration-cache entries.
    default: ""
  node-version:
    description: Optional pinned Node version.
    default: ""
  xcode-fingerprint:
    description: Use auto on Apple runners and none elsewhere.
    default: none
outputs:
  cache-write:
    value: ${{ steps.cache-policy.outputs.write }}
  gradle-main-cache-key:
    value: ${{ steps.cache-keys.outputs.gradle-main-key }}
  konan-main-cache-key:
    value: ${{ steps.cache-keys.outputs.konan-main-key }}
  konan-cache-hit:
    value: ${{ steps.konan-pr-write.outputs.cache-hit || steps.konan-pr-read.outputs.cache-hit || steps.konan-main-read.outputs.cache-hit }}
  konan-cache-primary-key:
    value: ${{ steps.cache-keys.outputs.konan-pr-key }}
runs:
  using: composite
  steps:
    - id: cache-policy
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REQUEST_READ_ONLY: ${{ inputs.cache-read-only }}
      shell: bash
      run: |
        write=false
        if [ "$REQUEST_READ_ONLY" != true ] && [ "$GITHUB_EVENT_NAME" = pull_request ] && \
          [ -n "$PR_NUMBER" ] && [ "$GITHUB_REF" = "refs/pull/$PR_NUMBER/merge" ]; then
          write=true
        fi
        printf 'write=%s\n' "$write" >> "$GITHUB_OUTPUT"
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
      with:
        distribution: temurin
        java-version: "17"
    - if: inputs.node-version != ''
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: ${{ inputs.node-version }}
    - id: cache-keys
      env:
        REQUESTED_FINGERPRINT: ${{ inputs.xcode-fingerprint }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      shell: bash
      run: |
        fingerprint="$REQUESTED_FINGERPRINT"
        if [ "$fingerprint" = auto ]; then
          fingerprint=$(xcodebuild -version | openssl dgst -sha256 | awk '{print $NF}')
        fi
        gradle="gradle-main-dependencies-v1-$RUNNER_OS-$RUNNER_ARCH-${{ hashFiles('**/*.gradle.kts', 'gradle/**/*.toml', 'gradle/wrapper/gradle-wrapper.properties', 'gradle.properties') }}"
        konan="konan-main-v1-$RUNNER_OS-$RUNNER_ARCH-$fingerprint-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', 'gradle.properties') }}"
        printf 'fingerprint=%s\ngradle-main-key=%s\nkonan-main-key=%s\nkonan-pr-key=konan-pr-v1-%s-%s-%s-%s-%s\n' \
          "$fingerprint" "$gradle" "$konan" "$RUNNER_OS" "$RUNNER_ARCH" "$fingerprint" \
          "${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', 'gradle.properties') }}" \
          "$PR_NUMBER" >> "$GITHUB_OUTPUT"
    - id: gradle-main-read
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.gradle/caches/modules-2
        key: ${{ steps.cache-keys.outputs.gradle-main-key }}
    - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      with:
        cache-read-only: ${{ steps.cache-policy.outputs.write != 'true' }}
        cache-encryption-key: ${{ inputs.cache-encryption-key }}
    - id: konan-main-read
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.konan/dependencies
        key: ${{ steps.cache-keys.outputs.konan-main-key }}
    - id: konan-pr-read
      if: steps.cache-policy.outputs.write != 'true' && github.event_name == 'pull_request'
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.konan
        key: ${{ steps.cache-keys.outputs.konan-pr-key }}
    - id: konan-pr-write
      if: steps.cache-policy.outputs.write == 'true'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.konan
        key: ${{ steps.cache-keys.outputs.konan-pr-key }}
