name: Release candidate

on:
  push:
    tags:
      - candidate/v*-rc.*

permissions:
  actions: read
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      candidate_commit: ${{ steps.identity.outputs.candidate_commit }}
      candidate_tree: ${{ steps.identity.outputs.candidate_tree }}
      release_tag: ${{ steps.identity.outputs.release_tag }}
      promotion_run_id: ${{ steps.promotion.outputs.promotion_run_id }}
      promotion_run_attempt: ${{ steps.promotion.outputs.promotion_run_attempt }}
    steps:
      - name: Validate the protected candidate ref before checkout
        id: candidate-ref
        shell: bash
        run: |
          test "$GITHUB_REF_TYPE" = tag
          test "$GITHUB_REF_PROTECTED" = true
          [[ "$GITHUB_REF_NAME" =~ ^candidate/v([0-9]+\.[0-9]+\.[0-9]+)-rc\.([1-9][0-9]*)$ ]]
          printf 'release_tag=v%s\n' "${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Bind the candidate tag to an immutable commit on main
        id: identity
        env:
          RELEASE_TAG: ${{ steps.candidate-ref.outputs.release_tag }}
        shell: bash
        run: |
          candidate_commit=$(git rev-parse 'HEAD^{commit}')
          candidate_tree=$(git rev-parse "$candidate_commit^{tree}")
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$candidate_commit" origin/main
          test "$(git rev-parse "$GITHUB_REF_NAME^{commit}")" = "$candidate_commit"
          {
            printf 'release_tag=%s\n' "$RELEASE_TAG"
            printf 'candidate_commit=%s\n' "$candidate_commit"
            printf 'candidate_tree=%s\n' "$candidate_tree"
          } >> "$GITHUB_OUTPUT"
      - name: Resolve the successful exact-commit promotion
        id: promotion
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_COMMIT: ${{ steps.identity.outputs.candidate_commit }}
        shell: bash
        run: |
          promotion_run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow=promote.yml \
            --branch=main --event=push --commit="$CANDIDATE_COMMIT" --status=success \
            --limit=1 --json databaseId --jq '.[0].databaseId')
          [[ "$promotion_run_id" =~ ^[1-9][0-9]*$ ]]
          details=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$promotion_run_id" \
            --jq '[.path,.event,.head_branch,.head_sha,.head_repository.full_name,.conclusion,.run_attempt] | @tsv')
          IFS=$'\t' read -r path event branch sha repository conclusion attempt <<< "$details"
          [[ "$path" = .github/workflows/promote.yml || "$path" = .github/workflows/promote.yml@* ]]
          test "$event" = push
          test "$branch" = main
          test "$sha" = "$CANDIDATE_COMMIT"
          test "$repository" = "$GITHUB_REPOSITORY"
          test "$conclusion" = success
          [[ "$attempt" =~ ^[1-9][0-9]*$ ]]
          {
            printf 'promotion_run_id=%s\n' "$promotion_run_id"
            printf 'promotion_run_attempt=%s\n' "$attempt"
          } >> "$GITHUB_OUTPUT"

  stage-candidate:
    needs: identity
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: release-candidate
    steps:
      - name: Require candidate signing material
        env:
          SIGNING_IN_MEMORY_KEY: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          SIGNING_IN_MEMORY_KEY_PASSWORD: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: |
          test -n "$SIGNING_IN_MEMORY_KEY"
          test -n "$SIGNING_IN_MEMORY_KEY_PASSWORD"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.identity.outputs.candidate_commit }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Resolve isolated candidate paths
        id: paths
        env:
          CANDIDATE_COMMIT: ${{ needs.identity.outputs.candidate_commit }}
        run: |
          {
            printf 'promoted=%s\n' "$RUNNER_TEMP/promoted"
            printf 'signed_maven=%s\n' "$RUNNER_TEMP/signed-maven"
            printf 'payload=%s\n' "$GITHUB_WORKSPACE/build/protected-candidate/$CANDIDATE_COMMIT/payload"
          } >> "$GITHUB_OUTPUT"
      - name: Download the exact validation artifact from the promotion
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ needs.identity.outputs.promotion_run_id }}
          github-token: ${{ github.token }}
          name: codex-agent-promoted-validation-${{ needs.identity.outputs.candidate_commit }}
          path: ${{ steps.paths.outputs.promoted }}/codex-agent-promoted-validation-${{ needs.identity.outputs.candidate_commit }}
      - name: Download every exact promoted lane artifact
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_COMMIT: ${{ needs.identity.outputs.candidate_commit }}
          PROMOTED: ${{ steps.paths.outputs.promoted }}
          PROMOTION_RUN_ID: ${{ needs.identity.outputs.promotion_run_id }}
        shell: bash
        run: |
          lanes=(
            contracts portable android node-js node-wasm
            desktop-macos-arm64 desktop-macos-x64 desktop-linux-arm64 desktop-linux-x64 desktop-windows-x64
            ios-native-tests ios-rust-device ios-rust-simulator ios-framework-device ios-framework-simulator
            ios-kotlin-tests ios-swift-build ios-swift-tests ios-package ios-privacy-metrics
            consumer-common consumer-android consumer-desktop consumer-ios-device consumer-ios-simulator
            consumer-node-js consumer-node-wasm
          )
          for lane in "${lanes[@]}"; do
            artifact="codex-agent-promoted-$lane-$CANDIDATE_COMMIT"
            gh run download "$PROMOTION_RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --name "$artifact" --dir "$PROMOTED/$artifact"
          done
      - name: Bind the executable release tool to the promoted contracts receipt
        id: tooling
        env:
          CANDIDATE_COMMIT: ${{ needs.identity.outputs.candidate_commit }}
          PROMOTED: ${{ steps.paths.outputs.promoted }}
        shell: bash
        run: |
          root="$PROMOTED/codex-agent-promoted-contracts-$CANDIDATE_COMMIT"
          receipt="$root/lane-receipt.json"
          jq -e '
            .schemaVersion == 2 and
            .repository == "codex-agent-labs/codex-agent" and
            .workflowPath == ".github/workflows/ci.yml" and
            .lane == "contracts" and
            .result == "passed"
          ' "$receipt" >/dev/null
          record=$(jq -ce '
            [.artifacts[] | select(.kind == "release-tooling")] |
            if length == 1 then .[0] else error("release tooling record must be unique") end
          ' "$receipt")
          relative=$(jq -r .relativePath <<<"$record")
          test "$relative" = payload/gradle/build-logic/build/libs/codex-agent-release-tooling.jar
          tool="$root/$relative"
          test -f "$tool"
          expected_bytes=$(jq -r .bytes <<<"$record")
          expected_sha256=$(jq -r .sha256 <<<"$record")
          [[ "$expected_bytes" =~ ^[1-9][0-9]*$ ]]
          [[ "$expected_sha256" =~ ^[0-9a-f]{64}$ ]]
          test "$(stat -c %s "$tool")" = "$expected_bytes"
          test "$(openssl dgst -sha256 "$tool" | awk '{print $NF}')" = "$expected_sha256"
          printf 'path=%s\n' "$tool" >> "$GITHUB_OUTPUT"
      - name: Forward and sign only the canonical promoted Maven primaries
        env:
          CANDIDATE_COMMIT: ${{ needs.identity.outputs.candidate_commit }}
          RELEASE_TAG: ${{ needs.identity.outputs.release_tag }}
          PROMOTED: ${{ steps.paths.outputs.promoted }}
          SIGNED_MAVEN: ${{ steps.paths.outputs.signed_maven }}
          RELEASE_TOOL: ${{ steps.tooling.outputs.path }}
          SIGNING_IN_MEMORY_KEY: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          SIGNING_IN_MEMORY_KEY_PASSWORD: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        shell: bash
        run: |
          for target in common android desktop ios-device ios-simulator node-js node-wasm; do
            source="$PROMOTED/codex-agent-promoted-consumer-$target-$CANDIDATE_COMMIT/payload/maven"
            test -d "$source/io/github/codex-agent-labs"
          done
          java -jar "$RELEASE_TOOL" stage-promoted-maven \
            --promoted "$PROMOTED" \
            --commit "$CANDIDATE_COMMIT" \
            --version "${RELEASE_TAG#v}" \
            --output "$SIGNED_MAVEN"
          mkdir -p "$RUNNER_TEMP/gnupg"
          chmod 700 "$RUNNER_TEMP/gnupg"
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          test -d "$SIGNED_MAVEN/io/github/codex-agent-labs"
          test -d "$SIGNED_MAVEN/io/github/ciurlaro"
          if find "$SIGNED_MAVEN" -type f ! -name 'maven-metadata.xml*' \
            \( -name '*.asc' -o -name '*.md5' -o -name '*.sha1' -o -name '*.sha256' -o -name '*.sha512' \) \
            -print -quit | grep -q .; then
            echo 'Promoted Maven repository already contains release sidecars.' >&2
            exit 1
          fi
          printf '%s' "$SIGNING_IN_MEMORY_KEY" | gpg --batch --import
          gpg --batch --with-colons --list-secret-keys | \
            awk -F: '$1 == "sec" { count++ } END { exit count == 1 ? 0 : 1 }'
          while IFS= read -r -d '' primary; do
            [[ "$(basename "$primary")" = maven-metadata.xml* ]] && continue
            printf '%s' "$SIGNING_IN_MEMORY_KEY_PASSWORD" | \
              gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --armor --detach-sign \
                --output "$primary.asc" "$primary"
          done < <(find "$SIGNED_MAVEN" -type f -print0 | sort -z)
      - name: Validate receipts and assemble the no-build candidate
        env:
          CANDIDATE_COMMIT: ${{ needs.identity.outputs.candidate_commit }}
          CANDIDATE_TREE: ${{ needs.identity.outputs.candidate_tree }}
          RELEASE_TAG: ${{ needs.identity.outputs.release_tag }}
          PROMOTED: ${{ steps.paths.outputs.promoted }}
          SIGNED_MAVEN: ${{ steps.paths.outputs.signed_maven }}
          PROMOTION_RUN_ID: ${{ needs.identity.outputs.promotion_run_id }}
          PROMOTION_RUN_ATTEMPT: ${{ needs.identity.outputs.promotion_run_attempt }}
          RELEASE_TOOL: ${{ steps.tooling.outputs.path }}
          PAYLOAD: ${{ steps.paths.outputs.payload }}
        shell: bash
        run: |
          java -jar "$RELEASE_TOOL" assemble-promoted-candidate \
            --repository "$GITHUB_WORKSPACE" \
            --promoted "$PROMOTED" \
            --signed-maven "$SIGNED_MAVEN" \
            --version "${RELEASE_TAG#v}" \
            --tag "$RELEASE_TAG" \
            --commit "$CANDIDATE_COMMIT" \
            --tree "$CANDIDATE_TREE" \
            --promotion-run-id "$PROMOTION_RUN_ID" \
            --promotion-run-attempt "$PROMOTION_RUN_ATTEMPT" \
            --release-tool "$RELEASE_TOOL" \
            --payload "$PAYLOAD"
      - name: Record the immutable candidate identity
        env:
          CANDIDATE_COMMIT: ${{ needs.identity.outputs.candidate_commit }}
          CANDIDATE_TREE: ${{ needs.identity.outputs.candidate_tree }}
          RELEASE_TAG: ${{ needs.identity.outputs.release_tag }}
          PROMOTION_RUN_ID: ${{ needs.identity.outputs.promotion_run_id }}
          PROMOTION_RUN_ATTEMPT: ${{ needs.identity.outputs.promotion_run_attempt }}
        run: |
          printf 'candidateTag=%s\nreleaseTag=%s\ncandidateCommit=%s\ncandidateTree=%s\n' \
            "$GITHUB_REF_NAME" "$RELEASE_TAG" "$CANDIDATE_COMMIT" "$CANDIDATE_TREE" \
            > build/candidate-identity.txt
          printf 'promotionRunId=%s\npromotionRunAttempt=%s\ncandidateRunId=%s\ncandidateRunAttempt=%s\n' \
            "$PROMOTION_RUN_ID" "$PROMOTION_RUN_ATTEMPT" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            >> build/candidate-identity.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          overwrite: false
          name: codex-agent-candidate-identity-${{ github.run_attempt }}
          path: build/candidate-identity.txt
          compression-level: 0
          retention-days: 30
      - name: Upload the exact technical candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          overwrite: false
          name: codex-agent-protected-candidate-${{ github.run_attempt }}
          path: ${{ steps.paths.outputs.payload }}/**
          compression-level: 0
          retention-days: 30
      - name: Upload candidate diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: ignore
          overwrite: true
          name: codex-agent-protected-candidate-diagnostics-${{ needs.identity.outputs.candidate_commit }}
          path: |
            build/protected-candidate/${{ needs.identity.outputs.candidate_commit }}/reports/**
            build/reports/**
          retention-days: 30
