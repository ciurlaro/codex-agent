name: Release candidate

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact release tag to verify
        required: true
        default: v0.2.0
        type: string
      ci_run_id:
        description: Successful exact-commit CI run ID when more than one exists
        required: false
        type: string
  push:
    tags:
      - candidate/v*

permissions:
  actions: read
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  portable-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      release_tag: ${{ steps.candidate.outputs.release_tag }}
      candidate_commit: ${{ steps.candidate.outputs.candidate_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Resolve the immutable candidate
        id: candidate
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          test "$GITHUB_REF_PROTECTED" = true
          release_tag="${INPUT_RELEASE_TAG:-${GITHUB_REF_NAME#candidate/}}"
          {
            printf 'release_tag=%s\n' "$release_tag"
            printf 'candidate_commit=%s\n' "$(git rev-parse 'HEAD^{commit}')"
          } >> "$GITHUB_OUTPUT"
      - run: ./gradlew -p buildSrc test --no-daemon --stacktrace
      - run: >-
          ./gradlew verifyReleaseMetadata
          -PcodexAgent.releaseTag=${{ steps.candidate.outputs.release_tag }}
          --no-daemon --stacktrace
      - run: ./gradlew verifyRepository --no-daemon --stacktrace

  desktop-runtime-evidence:
    needs: portable-gates
    uses: ./.github/workflows/desktop-runtime-evidence.yml
    with:
      candidateCommit: ${{ needs.portable-gates.outputs.candidate_commit }}

  resolve-ios-evidence:
    needs: portable-gates
    runs-on: ubuntu-24.04
    outputs:
      ci_run_id: ${{ steps.ci.outputs.ci_run_id }}
    steps:
      - name: Resolve one successful exact-commit CI run
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_COMMIT: ${{ needs.portable-gates.outputs.candidate_commit }}
          INPUT_CI_RUN_ID: ${{ inputs.ci_run_id }}
        run: |
          if [ -n "$INPUT_CI_RUN_ID" ]; then
            ci_run_id="$INPUT_CI_RUN_ID"
          else
            matches=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow=ci.yml \
              --commit="$CANDIDATE_COMMIT" --status=success --limit=2 \
              --json databaseId --jq 'length')
            test "$matches" -ge 1
            if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
              test "$matches" -eq 1
            fi
            ci_run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow=ci.yml \
              --commit="$CANDIDATE_COMMIT" --status=success --limit=1 \
              --json databaseId --jq '.[0].databaseId')
          fi
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ci_run_id" --jq .path)" = .github/workflows/ci.yml
          test "$(gh run view "$ci_run_id" --repo "$GITHUB_REPOSITORY" --json headSha --jq .headSha)" = "$CANDIDATE_COMMIT"
          test "$(gh run view "$ci_run_id" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = success
          printf 'ci_run_id=%s\n' "$ci_run_id" >> "$GITHUB_OUTPUT"

  apple-candidate:
    needs: [portable-gates, desktop-runtime-evidence, resolve-ios-evidence]
    runs-on: macos-26
    timeout-minutes: 300
    environment: release-candidate
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.portable-gates.outputs.candidate_commit }}
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
          components: llvm-tools-preview,rust-src
      - name: Resolve isolated candidate paths
        id: paths
        run: |
          {
            printf 'desktop=%s\n' "$RUNNER_TEMP/desktop-runtime-evidence"
            printf 'node=%s\n' "$RUNNER_TEMP/node-runtime-evidence"
            printf 'supervisor_identity=%s\n' "$RUNNER_TEMP/node-windows-supervisor-identity"
            printf 'supervisor_package=%s\n' "$RUNNER_TEMP/node-windows-supervisor-package"
            printf 'payload=%s\n' "$GITHUB_WORKSPACE/build/protected-candidate/${{ needs.portable-gates.outputs.candidate_commit }}/payload"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          pattern: codex-agent-desktop-runtime-evidence-*
          path: ${{ steps.paths.outputs.desktop }}
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: codex-agent-node-runtime-evidence-*
          path: ${{ steps.paths.outputs.node }}
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: codex-agent-node-evidence-runner
          path: codex-agent-runtime-node/build/distributions
      - uses: actions/download-artifact@v4
        with:
          name: codex-agent-node-windows-supervisor-identity
          path: ${{ steps.paths.outputs.supervisor_identity }}
      - uses: actions/download-artifact@v4
        with:
          name: codex-agent-node-windows-supervisor-package
          path: ${{ steps.paths.outputs.supervisor_package }}
      - name: Resolve the versionless Windows supervisor package
        id: supervisor
        shell: bash
        env:
          PACKAGE_DIRECTORY: ${{ steps.paths.outputs.supervisor_package }}
        run: |
          shopt -s nullglob
          packages=("$PACKAGE_DIRECTORY/"*-windows-supervisor.zip)
          test "${#packages[@]}" -eq 1
          printf 'package=%s\n' "${packages[0]}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ needs.resolve-ios-evidence.outputs.ci_run_id }}
          github-token: ${{ github.token }}
          name: codex-agent-ci-ios-arm64-${{ needs.portable-gates.outputs.candidate_commit }}
          path: build/ios-native-evidence
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ needs.resolve-ios-evidence.outputs.ci_run_id }}
          github-token: ${{ github.token }}
          name: codex-agent-ci-ios-simulator-arm64-${{ needs.portable-gates.outputs.candidate_commit }}
          path: build/ios-native-evidence
      - name: Assemble the exact protected candidate once
        run: >-
          ./gradlew assembleProtectedCandidate
          -PcodexAgent.candidateCommit=${{ needs.portable-gates.outputs.candidate_commit }}
          -PcodexAgent.releaseTag=${{ needs.portable-gates.outputs.release_tag }}
          -PcodexAgent.desktopEvidenceDirectory=${{ steps.paths.outputs.desktop }}
          -PcodexAgent.nodeEvidenceDirectory=${{ steps.paths.outputs.node }}
          -PcodexAgent.windowsNodeSupervisorIdentityFile=${{ steps.paths.outputs.supervisor_identity }}/windows-supervisor.json
          -PcodexAgent.windowsNodeSupervisorPackage=${{ steps.supervisor.outputs.package }}
          "-PcodexAgent.iosNativeEvidenceDirectory=$GITHUB_WORKSPACE/build/ios-native-evidence"
          --no-parallel --no-daemon --stacktrace
      - name: Upload the exact technical candidate
        uses: actions/upload-artifact@v4
        with:
          name: codex-agent-protected-candidate
          path: ${{ steps.paths.outputs.payload }}/**
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Upload candidate diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-agent-protected-candidate-diagnostics
          path: |
            codex-agent-runtime-ios/build/reports/ios-release/**
            codex-agent-runtime-ios/build/swift-authentication-tests-summary.json
            build/protected-candidate/${{ needs.portable-gates.outputs.candidate_commit }}/reports/**
          if-no-files-found: warn
          retention-days: 30
      - name: Require external publication approvals
        run: ./gradlew verifyPublicationReadiness --no-daemon --stacktrace
