name: Release candidate

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact release tag to verify
        required: true
        default: v0.2.0
        type: string
  push:
    tags:
      - candidate/v*

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  portable-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Resolve candidate release tag
        id: release
        shell: bash
        run: |
          test '${{ github.ref_protected }}' = true
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            tag='${{ inputs.release_tag }}'
          else
            test "$GITHUB_REF_TYPE" = tag
            tag=${GITHUB_REF_NAME#candidate/}
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - run: ./gradlew -p buildSrc test --no-daemon --stacktrace
      - run: ./gradlew verifyReleaseMetadata -PcodexAgent.releaseTag='${{ steps.release.outputs.tag }}' --no-daemon --stacktrace
      - run: ./gradlew verifyRepository --no-daemon --stacktrace

  apple-candidate:
    needs: portable-gates
    runs-on: macos-26
    timeout-minutes: 300
    environment: release-candidate
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      CENTRAL_STAGING: ${{ runner.temp }}/codex-agent-central-repository
      CANDIDATE_OUTPUT: ${{ runner.temp }}/codex-agent-candidate
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Resolve candidate release tag
        id: release
        shell: bash
        run: |
          test '${{ github.ref_protected }}' = true
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            tag='${{ inputs.release_tag }}'
          else
            test "$GITHUB_REF_TYPE" = tag
            tag=${GITHUB_REF_NAME#candidate/}
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Verify pinned Apple toolchain
        run: ./gradlew :codex-agent-runtime-ios:verifyAppleToolchain --no-daemon --stacktrace
      - name: Install pinned Rust toolchain
        run: >-
          rustup toolchain install 1.95.0 --profile minimal
          --target aarch64-apple-ios,aarch64-apple-ios-sim
      - name: Prepare measurement and output directories
        run: |
          test ! -e "$CENTRAL_STAGING"
          test ! -e "$CANDIDATE_OUTPUT"
          mkdir -p "$CENTRAL_STAGING" "$CANDIDATE_OUTPUT/resources"
      - name: Measure Rust build
        run: >-
          python3 release/scripts/measure_release_phase.py
          --phase rust-build
          --output "$CANDIDATE_OUTPUT/resources/rust-build.json"
          --workspace "$GITHUB_WORKSPACE"
          --track "$GITHUB_WORKSPACE/codex-agent-runtime-ios/build/rust"
          -- ./gradlew
          :codex-agent-runtime-ios:testCodexIosBridge
          :codex-agent-runtime-ios:testCodexIosDirectToolMode
          :codex-agent-runtime-ios:buildCodexIosArm64Rust
          :codex-agent-runtime-ios:buildCodexIosSimulatorArm64Rust
          --no-daemon --stacktrace
      - name: Measure XCFramework assembly and simulator tests
        run: >-
          python3 release/scripts/measure_release_phase.py
          --phase xcframework-assembly
          --output "$CANDIDATE_OUTPUT/resources/xcframework-assembly.json"
          --workspace "$GITHUB_WORKSPACE"
          --track "$GITHUB_WORKSPACE/codex-agent-runtime-ios/build/XCFrameworks"
          --track "$GITHUB_WORKSPACE/codex-agent-runtime-ios/build/release-xcframework"
          -- ./gradlew
          :codex-agent-runtime-ios:prepareCodexAgentReleaseXCFramework
          :codex-agent-runtime-ios:compileKotlinIosArm64
          :codex-agent-runtime-ios:iosSimulatorArm64Test
          --no-daemon --stacktrace
      - name: Measure Swift packaging and Apple gates
        run: >-
          python3 release/scripts/measure_release_phase.py
          --phase swift-packaging
          --output "$CANDIDATE_OUTPUT/resources/swift-packaging.json"
          --workspace "$GITHUB_WORKSPACE"
          --track "$GITHUB_WORKSPACE/codex-agent-runtime-ios/build/distributions"
          --track "$GITHUB_WORKSPACE/codex-agent-runtime-ios/build/apple-distribution"
          -- ./gradlew
          :codex-agent-runtime-ios:packageCodexAgentSwiftPackageBinary
          :codex-agent-runtime-ios:generateCodexAgentSwiftPackageChecksum
          :codex-agent-runtime-ios:packageCodexAgentAppleDistribution
          :codex-agent-runtime-ios:verifyCodexAgentSwiftPackage
          :codex-agent-runtime-ios:verifyCodexAgentSwiftAuthenticationTests
          :codex-agent-runtime-ios:verifyIosDeploymentTargets
          :codex-agent-runtime-ios:verifyIosPrivacyManifest
          :codex-agent-runtime-ios:verifyIosReleaseBudgets
          --no-daemon --stacktrace
      - name: Preserve immutable SwiftPM asset and audit evidence
        run: |
          /bin/cp -c codex-agent-runtime-ios/build/distributions/CodexAgent-0.2.0.xcframework.zip "$CANDIDATE_OUTPUT/"
          /bin/cp codex-agent-runtime-ios/build/distributions/CodexAgent-0.2.0.xcframework.zip.sha256 "$CANDIDATE_OUTPUT/"
          cp codex-agent-runtime-ios/build/reports/ios-release/privacy/audit.json "$CANDIDATE_OUTPUT/privacy-audit.json"
      - name: Run the complete iOS gate graph, including the committed SwiftPM checksum
        run: ./gradlew verifyIosRuntime --no-daemon --stacktrace
      - name: Remove safe Apple packaging intermediates before Maven staging
        run: >-
          rm -rf
          "$GITHUB_WORKSPACE/codex-agent-runtime-ios/build/apple-distribution"
          "$GITHUB_WORKSPACE/codex-agent-runtime-ios/build/release-xcframework"
          "$GITHUB_WORKSPACE/codex-agent-runtime-ios/build/XCFrameworks"
          "$GITHUB_WORKSPACE/codex-agent-runtime-ios/build/swift-consumer-derived-data"
          "$GITHUB_WORKSPACE/codex-agent-runtime-ios/build/swift-tests-derived-data"
          "$GITHUB_WORKSPACE/codex-agent-runtime-ios/build/distributions"
          "$GITHUB_WORKSPACE/codex-agent-runtime-ios/build/CodexAgentTestApp.xcarchive"
      - name: Measure exact Maven staging and Central bundle
        env:
          CENTRAL_BUNDLE: ${{ runner.temp }}/codex-agent-candidate/codex-agent-0.2.0-central.zip
          CENTRAL_REPORT: ${{ runner.temp }}/codex-agent-candidate/central-bundle-report.json
        run: |
          python3 release/scripts/measure_release_phase.py \
            --phase maven-publication \
            --output "$CANDIDATE_OUTPUT/resources/maven-publication.json" \
            --workspace "$GITHUB_WORKSPACE" \
            --track "$CENTRAL_STAGING" \
            --track "$CENTRAL_BUNDLE" \
            -- /bin/bash -euo pipefail -c '
              ./gradlew publishAllPublicationsToMigrationRepository \
                -PcodexAgent.localRepository="$CENTRAL_STAGING" \
                --no-daemon --no-configuration-cache --stacktrace
              python3 release/scripts/build_central_bundle.py \
                --repository "$CENTRAL_STAGING" \
                --output "$CENTRAL_BUNDLE" \
                --report "$CENTRAL_REPORT" \
                --require-signatures \
                --consume-repository \
                --required-coordinate io.github.ciurlaro:codex-agent-client:0.2.0 \
                --required-coordinate io.github.ciurlaro:codex-agent-runtime-android:0.2.0 \
                --required-coordinate io.github.ciurlaro:codex-agent-runtime-ios:0.2.0
            '
      - name: Generate candidate artifact, dependency, and resource report
        run: |
          python3 release/scripts/report_release_artifacts.py \
            --release-tag '${{ steps.release.outputs.tag }}' \
            --commit "$GITHUB_SHA" \
            --swift-asset "$CANDIDATE_OUTPUT/CodexAgent-0.2.0.xcframework.zip" \
            --swift-checksum "$CANDIDATE_OUTPUT/CodexAgent-0.2.0.xcframework.zip.sha256" \
            --central-bundle "$CANDIDATE_OUTPUT/codex-agent-0.2.0-central.zip" \
            --central-report "$CANDIDATE_OUTPUT/central-bundle-report.json" \
            --privacy-report "$CANDIDATE_OUTPUT/privacy-audit.json" \
            --approvals release/0.2.0-approvals.json \
            --package-swift Package.swift \
            --resource-report "$CANDIDATE_OUTPUT/resources/rust-build.json" \
            --resource-report "$CANDIDATE_OUTPUT/resources/xcframework-assembly.json" \
            --resource-report "$CANDIDATE_OUTPUT/resources/swift-packaging.json" \
            --resource-report "$CANDIDATE_OUTPUT/resources/maven-publication.json" \
            --output "$CANDIDATE_OUTPUT/release-artifact-report.json" \
            --candidate-manifest "$CANDIDATE_OUTPUT/candidate-manifest.json"
          rm -rf "$CENTRAL_STAGING"
      - name: Upload exact candidate payload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-agent-${{ steps.release.outputs.tag }}-candidate
          path: ${{ runner.temp }}/codex-agent-candidate/**
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-agent-${{ steps.release.outputs.tag }}-diagnostics
          path: |
            codex-agent-runtime-ios/build/reports/ios-release/**
            codex-agent-runtime-ios/build/swift-authentication-tests-summary.json
          if-no-files-found: warn
          retention-days: 30
      - name: Require hash-bound privacy and static-framework licence approvals
        run: ./gradlew verifyPublicationReadiness --no-daemon --stacktrace
