name: Release candidate

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact release tag to verify
        required: true
        default: v0.2.0
        type: string
  push:
    tags:
      - candidate/v*

permissions:
  actions: read
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  portable-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      release_tag: ${{ steps.candidate.outputs.release_tag }}
      commit_a: ${{ steps.candidate.outputs.commit_a }}
      commit_b: ${{ steps.candidate.outputs.commit_b }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Resolve the protected A/B candidate
        id: candidate
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          test "$GITHUB_REF_PROTECTED" = true
          release_tag="${INPUT_RELEASE_TAG:-${GITHUB_REF_NAME#candidate/}}"
          {
            printf 'release_tag=%s\n' "$release_tag"
            printf 'commit_a=%s\n' "$(git rev-parse HEAD^1)"
            printf 'commit_b=%s\n' "$(git rev-parse 'HEAD^{commit}')"
          } >> "$GITHUB_OUTPUT"
      - run: ./gradlew -p buildSrc test --no-daemon --stacktrace
      - run: >-
          ./gradlew verifyReleaseMetadata
          -PcodexAgent.releaseTag=${{ steps.candidate.outputs.release_tag }}
          --no-daemon --stacktrace
      - run: ./gradlew verifyRepository --no-daemon --stacktrace

  swiftpm-baseline:
    needs: portable-gates
    runs-on: macos-26
    timeout-minutes: 300
    environment: release-candidate
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.portable-gates.outputs.commit_a }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
          components: llvm-tools-preview
      - name: Resolve baseline proof path
        id: paths
        run: printf 'proof=%s\n' "$RUNNER_TEMP/swiftpm-baseline.json" >> "$GITHUB_OUTPUT"
      - name: Build Commit A once and record its immutable proof
        run: >-
          ./gradlew :codex-agent-runtime-ios:recordCodexAgentSwiftPackageBaseline
          -PcodexAgent.commitA=${{ needs.portable-gates.outputs.commit_a }}
          -PcodexAgent.swiftPmBaselineProof=${{ steps.paths.outputs.proof }}
          --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: codex-agent-swiftpm-commit-a
          path: ${{ steps.paths.outputs.proof }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  android-runtime-evidence:
    needs: portable-gates
    uses: ./.github/workflows/android-runtime-evidence.yml
    with:
      candidateCommit: ${{ needs.portable-gates.outputs.commit_b }}

  apple-candidate:
    needs: [portable-gates, swiftpm-baseline, android-runtime-evidence]
    runs-on: macos-26
    timeout-minutes: 300
    environment: release-candidate
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.portable-gates.outputs.commit_b }}
          fetch-depth: 2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
          components: llvm-tools-preview
      - name: Resolve isolated candidate paths
        id: paths
        run: |
          {
            printf 'baseline=%s\n' "$RUNNER_TEMP/swiftpm-baseline"
            printf 'android=%s\n' "$RUNNER_TEMP/android-runtime-evidence"
            printf 'payload=%s\n' "$GITHUB_WORKSPACE/build/protected-candidate/${{ needs.portable-gates.outputs.commit_b }}/payload"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: codex-agent-swiftpm-commit-a
          path: ${{ steps.paths.outputs.baseline }}
      - uses: actions/download-artifact@v4
        with:
          name: codex-agent-android-runtime-evidence
          path: ${{ steps.paths.outputs.android }}
      - name: Assemble the exact protected candidate once
        run: >-
          ./gradlew assembleProtectedCandidate
          -PcodexAgent.candidateCommit=${{ needs.portable-gates.outputs.commit_b }}
          -PcodexAgent.releaseTag=${{ needs.portable-gates.outputs.release_tag }}
          -PcodexAgent.androidEvidenceFile=${{ steps.paths.outputs.android }}/android-runtime-evidence.json
          -PcodexAgent.swiftPmBaselineProof=${{ steps.paths.outputs.baseline }}/swiftpm-baseline.json
          --no-parallel --no-daemon --stacktrace
      - name: Upload the exact technical candidate
        uses: actions/upload-artifact@v4
        with:
          name: codex-agent-protected-candidate
          path: ${{ steps.paths.outputs.payload }}/**
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Upload candidate diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-agent-protected-candidate-diagnostics
          path: |
            codex-agent-runtime-ios/build/reports/ios-release/**
            codex-agent-runtime-ios/build/swift-authentication-tests-summary.json
            build/protected-candidate/${{ needs.portable-gates.outputs.commit_b }}/reports/**
          if-no-files-found: warn
          retention-days: 30
      - name: Require external publication approvals
        run: ./gradlew verifyPublicationReadiness --no-daemon --stacktrace
