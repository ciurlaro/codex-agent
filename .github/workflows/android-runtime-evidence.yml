name: Android Runtime Evidence

on:
  workflow_call:
    inputs:
      candidateCommit:
        required: true
        type: string
      ciRunId:
        required: true
        type: string
      artifactName:
        required: true
        type: string
      planArtifact:
        required: true
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  firebase-arm64-runtime:
    environment: merge-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GOOGLE_CLOUD_PROJECT: ${{ vars.GOOGLE_CLOUD_PROJECT }}
    steps:
      - name: Validate trusted pre-merge identity
        env:
          ARTIFACT_NAME: ${{ inputs.artifactName }}
          PLAN_ARTIFACT: ${{ inputs.planArtifact }}
          CANDIDATE_COMMIT: ${{ inputs.candidateCommit }}
          CI_RUN_ID: ${{ inputs.ciRunId }}
          MERGE_READY: ${{ !github.event.pull_request.draft && contains(github.event.pull_request.labels.*.name, 'merge-ready') }}
          WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          GOOGLE_SERVICE_ACCOUNT: ${{ vars.GOOGLE_SERVICE_ACCOUNT }}
        shell: bash
        run: |
          [[ "$CANDIDATE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CI_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ARTIFACT_NAME" =~ ^codex-agent-ci-android-[0-9a-f]{40}$ ]]
          [[ "$PLAN_ARTIFACT" =~ ^codex-agent-ci-plan-[0-9a-f]{40}$ ]]
          tree=${ARTIFACT_NAME#codex-agent-ci-android-}
          test "$PLAN_ARTIFACT" = "codex-agent-ci-plan-$tree"
          test "$CI_RUN_ID" = "$GITHUB_RUN_ID"
          test "$CANDIDATE_COMMIT" = "$GITHUB_SHA"
          test "$GITHUB_REPOSITORY" = codex-agent-labs/codex-agent
          [[ "$GITHUB_EVENT_NAME" = pull_request || "$GITHUB_EVENT_NAME" = merge_group ]]
          [[ "$GITHUB_EVENT_NAME" = merge_group || "$MERGE_READY" = true ]]
          test -n "$GOOGLE_CLOUD_PROJECT"
          test -n "$WORKLOAD_IDENTITY_PROVIDER"
          test -n "$GOOGLE_SERVICE_ACCOUNT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ inputs.ciRunId }}
          github-token: ${{ github.token }}
          name: ${{ inputs.planArtifact }}
          path: build/ci/plan
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ inputs.ciRunId }}
          github-token: ${{ github.token }}
          name: ${{ inputs.artifactName }}
          path: build/ci/android
      - id: evidence
        run: >-
          python3 ci/evidence.py check --artifact build/ci/android
          --plan build/ci/plan/impact-plan.json
          --expected-commit "${{ inputs.candidateCommit }}"
          --expected-artifact "${{ inputs.artifactName }}"
          --expected-plan-artifact "${{ inputs.planArtifact }}"
          --expected-repository "${{ github.repository }}"
          --expected-event "${{ github.event_name }}"
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GOOGLE_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          project_id: ${{ env.GOOGLE_CLOUD_PROJECT }}
      - name: Run one lean Firebase ARM64 API 35 instrumentation matrix
        id: firebase
        shell: bash
        run: |
          matrix_file="$RUNNER_TEMP/firebase-test-matrix.json"
          matrix_status="$RUNNER_TEMP/firebase-test-status.txt"
          results="$RUNNER_TEMP/firebase-test-results"
          app=build/ci/android/payload/tooling/android-runtime-evidence/build/outputs/apk/debug/android-runtime-evidence-debug.apk
          test_apk=build/ci/android/payload/tooling/android-runtime-evidence/build/outputs/apk/androidTest/debug/android-runtime-evidence-debug-androidTest.apk
          test -f "$app"
          test -f "$test_apk"
          gcloud firebase test android run \
            --type=instrumentation --app="$app" --test="$test_apk" \
            --test-targets="class io.github.codex_agent_labs.codexmobile.app.runtime.bootstrap.RuntimeBootstrapDeviceTest" \
            --device=model=SmallPhone.arm,version=35,locale=en,orientation=portrait \
            --num-flaky-test-attempts=0 --timeout=15m \
            --no-auto-google-login --no-performance-metrics --no-record-video \
            --project="$GOOGLE_CLOUD_PROJECT" --format=none 2>&1 | tee "$matrix_status"
          mapfile -t matrix_ids < <(
            sed -nE 's/^Test \[(matrix-[A-Za-z0-9_-]+)\] has been created in the Google Cloud\.$/\1/p' "$matrix_status"
          )
          test "${#matrix_ids[@]}" -eq 1
          access_token=$(gcloud auth print-access-token)
          results_uri=$(FIREBASE_ACCESS_TOKEN="$access_token" python3 - \
            "$matrix_file" "${matrix_ids[0]}" "$GOOGLE_CLOUD_PROJECT" <<'PY'
          import json
          import os
          import sys
          from http.client import HTTPSConnection
          from pathlib import Path
          from urllib.parse import quote, urlsplit

          path = f"/v1/projects/{quote(sys.argv[3], safe='')}/testMatrices/{quote(sys.argv[2], safe='')}"
          connection = HTTPSConnection("testing.googleapis.com", timeout=30)
          try:
              connection.request("GET", path, headers={"Authorization": f"Bearer {os.environ['FIREBASE_ACCESS_TOKEN']}"})
              response = connection.getresponse()
              raw = response.read()
              if response.status != 200:
                  raise SystemExit(f"Testing API returned HTTP {response.status}")
          finally:
              connection.close()
          Path(sys.argv[1]).write_bytes(raw)
          matrix = json.loads(raw)
          if matrix.get("testMatrixId") != sys.argv[2] or matrix.get("projectId") != sys.argv[3]:
              raise SystemExit("Firebase matrix identity mismatch")
          uri = matrix["resultStorage"]["googleCloudStorage"]["gcsPath"].rstrip("/")
          parsed = urlsplit(uri)
          if parsed.scheme != "gs" or not parsed.netloc or not parsed.path:
              raise SystemExit("Firebase matrix results URI is invalid")
          print(uri)
          PY
          )
          unset access_token
          mkdir -p "$results"
          gcloud storage cp "$results_uri/**/*.xml" "$results"
          find "$results" -type f -name '*.xml' -print -quit | grep -q .
          printf 'matrix=%s\nresults=%s\n' "$matrix_file" "$results" >> "$GITHUB_OUTPUT"
      - name: Stage raw Firebase results as untrusted data
        shell: bash
        run: |
          mkdir -p build/ci/firebase/results
          cp "${{ steps.firebase.outputs.matrix }}" build/ci/firebase/matrix.json
          cp -R "${{ steps.firebase.outputs.results }}/." build/ci/firebase/results/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          overwrite: true
          name: codex-agent-ci-android-firebase-${{ inputs.candidateCommit }}
          path: build/ci/firebase
          compression-level: 0
          retention-days: 1

  attach-evidence:
    needs: firebase-arm64-runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ inputs.ciRunId }}
          github-token: ${{ github.token }}
          name: ${{ inputs.planArtifact }}
          path: build/ci/plan
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ inputs.ciRunId }}
          github-token: ${{ github.token }}
          name: ${{ inputs.artifactName }}
          path: build/ci/android
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ inputs.ciRunId }}
          github-token: ${{ github.token }}
          name: codex-agent-ci-android-firebase-${{ inputs.candidateCommit }}
          path: build/ci/firebase
      - uses: ./.github/actions/setup-kmp
        with:
          cache-read-only: "true"
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - name: Record evidence against the exact Android lane bytes
        run: >-
          ./gradlew :tooling:android-runtime-evidence:recordFirebaseAndroidRuntimeEvidence
          -PcodexAgent.candidateCommit=${{ inputs.candidateCommit }}
          -PcodexAgent.firebaseMatrixFile="$PWD/build/ci/firebase/matrix.json"
          -PcodexAgent.firebaseResultsDirectory="$PWD/build/ci/firebase/results"
          -PcodexAgent.firebaseApplicationApk="$PWD/build/ci/android/payload/tooling/android-runtime-evidence/build/outputs/apk/debug/android-runtime-evidence-debug.apk"
          -PcodexAgent.firebaseTestApk="$PWD/build/ci/android/payload/tooling/android-runtime-evidence/build/outputs/apk/androidTest/debug/android-runtime-evidence-debug-androidTest.apk"
          -PcodexAgent.firebaseReleaseAar="$PWD/build/ci/android/payload/codex-agent-runtime-android/build/outputs/aar/codex-agent-runtime-android-release.aar"
          --parallel --stacktrace
      - name: Attach trusted evidence to the Android lane artifact
        run: >-
          python3 ci/evidence.py attach --artifact build/ci/android
          --plan build/ci/plan/impact-plan.json
          --source tooling/android-runtime-evidence/build/reports/firebase-android-runtime-evidence
          --expected-commit "${{ inputs.candidateCommit }}"
          --expected-artifact "${{ inputs.artifactName }}"
          --expected-plan-artifact "${{ inputs.planArtifact }}"
          --expected-repository "${{ github.repository }}"
          --expected-event "${{ github.event_name }}" --replace
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          overwrite: true
          name: ${{ inputs.artifactName }}
          path: build/ci/android
          compression-level: 0
          retention-days: 90
