name: Android Runtime Evidence

on:
  workflow_call:
    inputs:
      candidateCommit:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      candidateCommit:
        description: Exact candidate commit SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  arm64-runtime:
    runs-on: [self-hosted, linux, arm64, android]
    environment: release-candidate
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidateCommit }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Run and record the exact ARM64 runtime smoke
        run: >-
          ./gradlew :codex-agent-runtime-android:recordAndroidRuntimeEvidence
          -PcodexAgent.candidateCommit=${{ inputs.candidateCommit }}
          --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: codex-agent-android-runtime-evidence
          path: |
            codex-agent-runtime-android/build/reports/android-runtime-evidence/android-runtime-evidence.json
            codex-agent-runtime-android/build/reports/android-runtime-evidence/codex-agent-runtime-android-debug-androidTest.apk
            codex-agent-runtime-android/build/reports/android-runtime-evidence/RuntimeBootstrapDeviceTest.xml
          if-no-files-found: error
          retention-days: 30
