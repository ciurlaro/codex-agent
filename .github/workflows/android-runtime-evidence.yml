name: Android Runtime Evidence

on:
  workflow_call:
    inputs:
      candidateCommit:
        required: true
        type: string
      ciRunId:
        required: true
        type: string
    secrets:
      GRADLE_ENCRYPTION_KEY:
        required: false

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: android-runtime-evidence-${{ inputs.candidateCommit }}
  cancel-in-progress: false

jobs:
  firebase-arm64-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GOOGLE_CLOUD_PROJECT: ${{ vars.GOOGLE_CLOUD_PROJECT }}
    steps:
      - name: Validate protected identity and Google configuration before running code
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidateCommit }}
          CI_RUN_ID: ${{ inputs.ciRunId }}
          WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          GOOGLE_SERVICE_ACCOUNT: ${{ vars.GOOGLE_SERVICE_ACCOUNT }}
        shell: bash
        run: |
          [[ "$CANDIDATE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CI_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          test -n "$GOOGLE_CLOUD_PROJECT"
          test -n "$WORKLOAD_IDENTITY_PROVIDER"
          test -n "$GOOGLE_SERVICE_ACCOUNT"
          test "$GITHUB_SHA" = "$CANDIDATE_COMMIT"
          test "$GITHUB_REF_TYPE" = tag
          test "$GITHUB_REF_PROTECTED" = true
          [[ "$GITHUB_REF_NAME" =~ ^candidate/v[0-9]+\.[0-9]+\.[0-9]+-rc\.[1-9][0-9]*$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.candidateCommit }}
          fetch-depth: 1
      - uses: ./.github/actions/setup-kmp
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ inputs.ciRunId }}
          github-token: ${{ github.token }}
          name: codex-agent-ci-android-binaries-${{ inputs.candidateCommit }}
          path: build/android-ci-binaries
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GOOGLE_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          project_id: ${{ env.GOOGLE_CLOUD_PROJECT }}
      - name: Run one lean Firebase ARM64 API 35 instrumentation matrix
        id: firebase
        shell: bash
        run: |
          matrix_file="$RUNNER_TEMP/firebase-test-matrix.json"
          results="$RUNNER_TEMP/firebase-test-results"
          gcloud firebase test android run \
            --type=instrumentation \
            --app=build/android-ci-binaries/tooling/android-runtime-evidence/build/outputs/apk/debug/android-runtime-evidence-debug.apk \
            --test=build/android-ci-binaries/tooling/android-runtime-evidence/build/outputs/apk/androidTest/debug/android-runtime-evidence-debug-androidTest.apk \
            --test-targets=class:io.github.ciurlaro.codexmobile.app.runtime.bootstrap.RuntimeBootstrapDeviceTest \
            --device=model=SmallPhone.arm,version=35,locale=en,orientation=portrait \
            --num-flaky-test-attempts=0 --timeout=15m \
            --no-auto-google-login --no-performance-metrics --no-record-video \
            --project="$GOOGLE_CLOUD_PROJECT" --format=json > "$matrix_file"
          mapfile -t result_uris < <(
            sed -nE 's/^[[:space:]]*"gcsPath":[[:space:]]*"([^"]+)".*$/\1/p' "$matrix_file"
          )
          test "${#result_uris[@]}" -eq 1
          results_uri="${result_uris[0]}"
          [[ "$results_uri" == gs://* ]]
          mkdir -p "$results"
          gcloud storage cp "$results_uri/**/*.xml" "$results"
          find "$results" -type f -name '*.xml' -print -quit | grep -q .
          {
            printf 'matrix_file=%s\n' "$matrix_file"
            printf 'results=%s\n' "$results"
          } >> "$GITHUB_OUTPUT"
      - name: Record hash-bound Firebase evidence from the exact CI binaries
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidateCommit }}
          FIREBASE_MATRIX_FILE: ${{ steps.firebase.outputs.matrix_file }}
          FIREBASE_RESULTS_DIRECTORY: ${{ steps.firebase.outputs.results }}
        run: >-
          ./gradlew :tooling:android-runtime-evidence:recordFirebaseAndroidRuntimeEvidence
          -PcodexAgent.candidateCommit="$CANDIDATE_COMMIT"
          -PcodexAgent.firebaseMatrixFile="$FIREBASE_MATRIX_FILE"
          -PcodexAgent.firebaseResultsDirectory="$FIREBASE_RESULTS_DIRECTORY"
          -PcodexAgent.firebaseApplicationApk="$PWD/build/android-ci-binaries/tooling/android-runtime-evidence/build/outputs/apk/debug/android-runtime-evidence-debug.apk"
          -PcodexAgent.firebaseTestApk="$PWD/build/android-ci-binaries/tooling/android-runtime-evidence/build/outputs/apk/androidTest/debug/android-runtime-evidence-debug-androidTest.apk"
          -PcodexAgent.firebaseReleaseAar="$PWD/build/android-ci-binaries/codex-agent-runtime-android/build/outputs/aar/codex-agent-runtime-android-release.aar"
          --parallel --stacktrace
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          overwrite: true
          name: codex-agent-android-runtime-evidence-${{ inputs.candidateCommit }}
          path: tooling/android-runtime-evidence/build/reports/firebase-android-runtime-evidence/**
          compression-level: 0
          retention-days: 30
