name: Publish verified release

on:
  workflow_run:
    workflows: [Release candidate]
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: macos-26
    timeout-minutes: 180
    environment: release-publication
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      PAYLOAD: ${{ runner.temp }}/verified-candidate
      MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          pattern: codex-agent-*-candidate
          path: ${{ runner.temp }}/verified-candidate
          merge-multiple: true
      - name: Verify successful candidate bytes and approval scope
        id: candidate
        run: |
          tag=$(python3 release/scripts/verify_candidate_payload.py \
            --payload "$PAYLOAD" \
            --repository "$GITHUB_WORKSPACE" \
            --expected-commit '${{ github.event.workflow_run.head_sha }}')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "asset=$(jq -r '.swiftAsset.path | split("/")[-1]' "$PAYLOAD/candidate-manifest.json")" >> "$GITHUB_OUTPUT"
          echo "bundle=$(jq -r '.centralBundle.path | split("/")[-1]' "$PAYLOAD/candidate-manifest.json")" >> "$GITHUB_OUTPUT"
      - name: Recheck publication approvals after protected-environment approval
        run: ./gradlew verifyPublicationReadiness --no-daemon --stacktrace
      - name: Create or reuse exact draft release record
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.candidate.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/release.json"
            if jq -e '.draft == true' "$RUNNER_TEMP/release.json" >/dev/null; then
              test "$(jq -r '.target_commitish' "$RUNNER_TEMP/release.json")" = \
                '${{ github.event.workflow_run.head_sha }}'
            else
              git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
              test "$(git rev-list -n 1 "$RELEASE_TAG")" = '${{ github.event.workflow_run.head_sha }}'
            fi
            gh release download "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern central-deployment.json \
              --dir "$RUNNER_TEMP" || true
          else
            ! git ls-remote --exit-code origin "refs/tags/$RELEASE_TAG"
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target '${{ github.event.workflow_run.head_sha }}' \
              --title "codex-agent $RELEASE_TAG" \
              --generate-notes \
              --draft
          fi
      - name: Upload or reuse exact user-managed Central deployment
        env:
          RELEASE_TAG: ${{ steps.candidate.outputs.tag }}
          CENTRAL_BUNDLE: ${{ steps.candidate.outputs.bundle }}
        run: |
          ./gradlew validateCentralDeployment \
            -PcodexAgent.centralBundle="$PAYLOAD/$CENTRAL_BUNDLE" \
            -PcodexAgent.candidateManifest="$PAYLOAD/candidate-manifest.json" \
            -PcodexAgent.centralDeploymentRecord="$RUNNER_TEMP/central-deployment.json" \
            --no-configuration-cache --stacktrace
      - name: Bind validated deployment and exact candidate assets to draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.candidate.outputs.tag }}
          SWIFT_ASSET: ${{ steps.candidate.outputs.asset }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "$PAYLOAD/$SWIFT_ASSET" \
            "$PAYLOAD/candidate-manifest.json" \
            "$RUNNER_TEMP/central-deployment.json" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
          rm -rf "$RUNNER_TEMP/release-download"
          mkdir "$RUNNER_TEMP/release-download"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$SWIFT_ASSET" \
            --dir "$RUNNER_TEMP/release-download"
          test "$(shasum -a 256 "$RUNNER_TEMP/release-download/$SWIFT_ASSET" | awk '{print $1}')" = \
            "$(jq -r '.swiftAsset.sha256' "$PAYLOAD/candidate-manifest.json")"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/release.json"
          if jq -e '.draft == true' "$RUNNER_TEMP/release.json" >/dev/null; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          else
            jq -e '.draft == false' "$RUNNER_TEMP/release.json" >/dev/null
          fi
      - name: Verify public SwiftPM resolution from a clean consumer
        run: |
          xcodebuild -version
          swift --version
          mkdir -p "$RUNNER_TEMP/publication-resources"
          python3 release/scripts/measure_release_phase.py \
            --phase public-swiftpm-resolution \
            --output "$RUNNER_TEMP/publication-resources/public-swiftpm-resolution.json" \
            --workspace "$GITHUB_WORKSPACE" \
            --track "$RUNNER_TEMP/codex-agent-public-derived-data" \
            --track "$RUNNER_TEMP/codex-agent-public-packages" \
            -- /bin/bash -euo pipefail -c '
              cd codex-agent-runtime-ios/apple/RemoteConsumer
              xcodebuild -scheme CodexAgentRemoteConsumer \
                -configuration Release \
                -destination "generic/platform=iOS Simulator" \
                -derivedDataPath "$RUNNER_TEMP/codex-agent-public-derived-data" \
                -clonedSourcePackagesDirPath "$RUNNER_TEMP/codex-agent-public-packages" \
                -disablePackageRepositoryCache \
                CODE_SIGNING_ALLOWED=NO clean build
            '
      - name: Release the already-validated Central deployment
        env:
          RELEASE_TAG: ${{ steps.candidate.outputs.tag }}
          CENTRAL_BUNDLE: ${{ steps.candidate.outputs.bundle }}
        run: |
          ./gradlew releaseCentralDeployment \
            -PcodexAgent.centralBundle="$PAYLOAD/$CENTRAL_BUNDLE" \
            -PcodexAgent.candidateManifest="$PAYLOAD/candidate-manifest.json" \
            -PcodexAgent.centralDeploymentRecord="$RUNNER_TEMP/central-deployment.json" \
            --no-configuration-cache --stacktrace
      - name: Persist published deployment record
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.candidate.outputs.tag }}
        run: >-
          gh release upload "$RELEASE_TAG"
          "$RUNNER_TEMP/central-deployment.json"
          --repo "$GITHUB_REPOSITORY"
          --clobber
      - name: Upload publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-agent-${{ steps.candidate.outputs.tag }}-publication
          path: |
            ${{ runner.temp }}/central-deployment.json
            ${{ runner.temp }}/publication-resources/**
            ${{ runner.temp }}/verified-candidate/candidate-manifest.json
            ${{ runner.temp }}/verified-candidate/release-artifact-report.json
          if-no-files-found: warn
          retention-days: 90
