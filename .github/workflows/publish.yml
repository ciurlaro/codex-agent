name: Publish verified release

on:
  workflow_run:
    workflows: [Release candidate]
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: macos-26
    timeout-minutes: 180
    environment: release-publication
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Resolve publication paths
        id: paths
        run: |
          {
            printf 'payload=%s\n' "$RUNNER_TEMP/verified-candidate"
            printf 'record=%s\n' "$RUNNER_TEMP/central-deployment.json"
            printf 'candidate_outputs=%s\n' "$RUNNER_TEMP/candidate-outputs.txt"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          name: codex-agent-protected-candidate
          path: ${{ steps.paths.outputs.payload }}
      - name: Verify the transported candidate and emit exact names
        id: candidate
        env:
          PAYLOAD: ${{ steps.paths.outputs.payload }}
          CANDIDATE_OUTPUTS: ${{ steps.paths.outputs.candidate_outputs }}
        run: |
          ./gradlew verifyCandidatePayload \
            -PcodexAgent.candidateManifest="$PAYLOAD/candidate-manifest.json" \
            -PcodexAgent.candidatePayload="$PAYLOAD" \
            -PcodexAgent.candidateCommit='${{ github.event.workflow_run.head_sha }}' \
            -PcodexAgent.releaseTag=v0.2.0 \
            -PcodexAgent.githubOutputFile="$CANDIDATE_OUTPUTS" \
            --no-daemon --stacktrace
          cat "$CANDIDATE_OUTPUTS" >> "$GITHUB_OUTPUT"
      - name: Recheck publication approvals after protected-environment approval
        run: ./gradlew verifyPublicationReadiness --no-daemon --stacktrace
      - name: Create or reuse the exact GitHub release record
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_COMMIT: ${{ github.event.workflow_run.head_sha }}
          RELEASE_TAG: ${{ steps.candidate.outputs.releaseTag }}
          RECORD: ${{ steps.paths.outputs.record }}
        run: |
          error_file="$RUNNER_TEMP/release-view-error.txt"
          if draft=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>"$error_file"); then
            if [ "$draft" = true ]; then
              test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish)" = "$EXPECTED_COMMIT"
            else
              test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)" = "$EXPECTED_COMMIT"
            fi
            test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '[.assets[] | select(.name == "central-deployment.json")] | length')" -eq 1
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern central-deployment.json --dir "$RUNNER_TEMP" --clobber
            allow_upload=false
          elif grep -Eqi 'HTTP 404|release not found' "$error_file"; then
            tag_error="$RUNNER_TEMP/release-tag-error.txt"
            if tag_commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha 2>"$tag_error"); then
              test "$tag_commit" = "$EXPECTED_COMMIT"
            elif ! grep -Eqi 'HTTP 404|No commit found' "$tag_error"; then
              cat "$tag_error" >&2
              exit 1
            fi
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$EXPECTED_COMMIT" \
              --title "codex-agent $RELEASE_TAG" \
              --generate-notes \
              --draft
            draft=true
            allow_upload=true
          else
            cat "$error_file" >&2
            exit 1
          fi
          {
            printf 'draft=%s\n' "$draft"
            printf 'allow_upload=%s\n' "$allow_upload"
          } >> "$GITHUB_OUTPUT"
      - name: Prepare or reuse the exact user-managed Central deployment
        env:
          PAYLOAD: ${{ steps.paths.outputs.payload }}
          CENTRAL_BUNDLE: ${{ steps.candidate.outputs.centralBundle }}
          RECORD: ${{ steps.paths.outputs.record }}
        run: >-
          ./gradlew prepareCentralDeployment
          -PcodexAgent.centralBundle="$PAYLOAD/$CENTRAL_BUNDLE"
          -PcodexAgent.candidateManifest="$PAYLOAD/candidate-manifest.json"
          -PcodexAgent.centralDeploymentRecord="$RECORD"
          -PcodexAgent.allowCentralUpload=${{ steps.release.outputs.allow_upload }}
          --no-daemon --no-configuration-cache --stacktrace
      - name: Persist the Central deployment ID immediately
        env:
          GH_TOKEN: ${{ github.token }}
          RECORD: ${{ steps.paths.outputs.record }}
          RELEASE_TAG: ${{ steps.candidate.outputs.releaseTag }}
        run: >-
          gh release upload "$RELEASE_TAG" "$RECORD"
          --repo "$GITHUB_REPOSITORY" --clobber
      - name: Await validation of the recorded Central deployment
        env:
          PAYLOAD: ${{ steps.paths.outputs.payload }}
          CENTRAL_BUNDLE: ${{ steps.candidate.outputs.centralBundle }}
          RECORD: ${{ steps.paths.outputs.record }}
        run: >-
          ./gradlew awaitCentralValidation
          -PcodexAgent.centralBundle="$PAYLOAD/$CENTRAL_BUNDLE"
          -PcodexAgent.candidateManifest="$PAYLOAD/candidate-manifest.json"
          -PcodexAgent.centralDeploymentRecord="$RECORD"
          --no-daemon --no-configuration-cache --stacktrace
      - name: Attach the validated record and exact candidate assets
        env:
          GH_TOKEN: ${{ github.token }}
          PAYLOAD: ${{ steps.paths.outputs.payload }}
          RECORD: ${{ steps.paths.outputs.record }}
          RELEASE_TAG: ${{ steps.candidate.outputs.releaseTag }}
          SWIFT_ASSET: ${{ steps.candidate.outputs.swiftAsset }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "$RECORD" \
            "$PAYLOAD/$SWIFT_ASSET" \
            "$PAYLOAD/candidate-manifest.json" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$SWIFT_ASSET" \
            --dir "$RUNNER_TEMP" \
            --clobber
          cmp "$PAYLOAD/$SWIFT_ASSET" "$RUNNER_TEMP/$SWIFT_ASSET"
      - name: Publish the exact GitHub release
        if: steps.release.outputs.draft == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.candidate.outputs.releaseTag }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
      - name: Verify the published GitHub release identity
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_COMMIT: ${{ github.event.workflow_run.head_sha }}
          RELEASE_TAG: ${{ steps.candidate.outputs.releaseTag }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)" = "$EXPECTED_COMMIT"
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = false
      - name: Verify public SwiftPM asset and clean resolution
        env:
          PAYLOAD: ${{ steps.paths.outputs.payload }}
        run: >-
          ./gradlew verifyPublicSwiftResolution
          -PcodexAgent.candidateManifest="$PAYLOAD/candidate-manifest.json"
          --no-daemon --stacktrace
      - name: Release the same validated Central deployment and await PUBLISHED
        env:
          PAYLOAD: ${{ steps.paths.outputs.payload }}
          CENTRAL_BUNDLE: ${{ steps.candidate.outputs.centralBundle }}
          RECORD: ${{ steps.paths.outputs.record }}
        run: >-
          ./gradlew releaseCentralDeployment
          -PcodexAgent.centralBundle="$PAYLOAD/$CENTRAL_BUNDLE"
          -PcodexAgent.candidateManifest="$PAYLOAD/candidate-manifest.json"
          -PcodexAgent.centralDeploymentRecord="$RECORD"
          --no-daemon --no-configuration-cache --stacktrace
      - name: Persist the PUBLISHED Central deployment record
        env:
          GH_TOKEN: ${{ github.token }}
          RECORD: ${{ steps.paths.outputs.record }}
          RELEASE_TAG: ${{ steps.candidate.outputs.releaseTag }}
        run: >-
          gh release upload "$RELEASE_TAG" "$RECORD"
          --repo "$GITHUB_REPOSITORY" --clobber
      - name: Upload publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-agent-${{ steps.candidate.outputs.releaseTag }}-publication
          path: |
            ${{ steps.paths.outputs.record }}
            build/reports/release-candidate/payload-verification.json
            build/reports/release-candidate/public-swift-resolution.json
            ${{ steps.paths.outputs.payload }}/candidate-manifest.json
          if-no-files-found: warn
          retention-days: 90
