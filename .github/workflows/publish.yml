name: Publish verified release

on:
  workflow_run:
    workflows: [Release candidate]
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:
  publish-core:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    environment: release-publication
    outputs:
      candidate_commit: ${{ steps.identity.outputs.candidate_commit }}
      release_tag: ${{ steps.identity.outputs.release_tag }}
    steps:
      - name: Require Central credentials before publication
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          test -n "$MAVEN_CENTRAL_USERNAME"
          test -n "$MAVEN_CENTRAL_PASSWORD"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Resolve publication paths
        id: paths
        run: |
          {
            printf 'payload=%s\n' "$RUNNER_TEMP/verified-candidate"
            printf 'identity=%s\n' "$RUNNER_TEMP/candidate-identity"
            printf 'record=%s\n' "$RUNNER_TEMP/central-deployment.json"
            printf 'candidate_outputs=%s\n' "$RUNNER_TEMP/candidate-outputs.txt"
            printf 'verification=%s\n' "$RUNNER_TEMP/payload-verification.json"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          name: codex-agent-candidate-identity-${{ github.event.workflow_run.run_attempt }}
          path: ${{ steps.paths.outputs.identity }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          name: codex-agent-protected-candidate-${{ github.event.workflow_run.run_attempt }}
          path: ${{ steps.paths.outputs.payload }}
      - name: Verify the exact candidate and promotion identity
        id: identity
        env:
          IDENTITY: ${{ steps.paths.outputs.identity }}/candidate-identity.txt
          WORKFLOW_COMMIT: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          PAYLOAD: ${{ steps.paths.outputs.payload }}
        shell: bash
        run: |
          mapfile -t lines < "$IDENTITY"
          test "${#lines[@]}" -eq 8
          candidate_tag=${lines[0]#candidateTag=}
          release_tag=${lines[1]#releaseTag=}
          candidate_commit=${lines[2]#candidateCommit=}
          candidate_tree=${lines[3]#candidateTree=}
          promotion_run_id=${lines[4]#promotionRunId=}
          promotion_run_attempt=${lines[5]#promotionRunAttempt=}
          candidate_run_id=${lines[6]#candidateRunId=}
          candidate_run_attempt=${lines[7]#candidateRunAttempt=}
          test "${lines[0]}" = "candidateTag=$candidate_tag"
          test "${lines[1]}" = "releaseTag=$release_tag"
          test "${lines[2]}" = "candidateCommit=$candidate_commit"
          test "${lines[3]}" = "candidateTree=$candidate_tree"
          test "${lines[4]}" = "promotionRunId=$promotion_run_id"
          test "${lines[5]}" = "promotionRunAttempt=$promotion_run_attempt"
          test "${lines[6]}" = "candidateRunId=$candidate_run_id"
          test "${lines[7]}" = "candidateRunAttempt=$candidate_run_attempt"
          [[ "$candidate_tag" =~ ^candidate/v([0-9]+\.[0-9]+\.[0-9]+)-rc\.([1-9][0-9]*)$ ]]
          version=${BASH_REMATCH[1]}
          test "$release_tag" = "v$version"
          [[ "$candidate_commit" =~ ^[0-9a-f]{40}$ ]]
          [[ "$candidate_tree" =~ ^[0-9a-f]{40}$ ]]
          [[ "$promotion_run_id" =~ ^[1-9][0-9]*$ ]]
          [[ "$promotion_run_attempt" =~ ^[1-9][0-9]*$ ]]
          test "$candidate_commit" = "$WORKFLOW_COMMIT"
          test "$candidate_run_id" = "$WORKFLOW_RUN_ID"
          test "$candidate_run_attempt" = "$WORKFLOW_RUN_ATTEMPT"
          test "$(git rev-parse 'HEAD^{commit}')" = "$candidate_commit"
          test "$(git rev-parse 'HEAD^{tree}')" = "$candidate_tree"
          git fetch --no-tags --force origin "refs/tags/$candidate_tag:refs/tags/$candidate_tag"
          test "$(git rev-parse "refs/tags/$candidate_tag^{commit}")" = "$candidate_commit"
          promotion_receipt="$PAYLOAD/promotion-receipt.json"
          test "$(jq -r .promotionRunId "$promotion_receipt")" = "$promotion_run_id"
          test "$(jq -r .promotionRunAttempt "$promotion_receipt")" = "$promotion_run_attempt"
          manifest="$PAYLOAD/candidate-manifest.json"
          jq -e '
            .schemaVersion == 11 and
            (.evidence.releaseTooling | keys | sort) == ["bytes", "fileName", "sha256"]
          ' "$manifest" >/dev/null
          release_tool_name=$(jq -r .evidence.releaseTooling.fileName "$manifest")
          release_tool_bytes=$(jq -r .evidence.releaseTooling.bytes "$manifest")
          release_tool_sha256=$(jq -r .evidence.releaseTooling.sha256 "$manifest")
          test "$release_tool_name" = codex-agent-release-tooling.jar
          [[ "$release_tool_bytes" =~ ^[1-9][0-9]*$ ]]
          [[ "$release_tool_sha256" =~ ^[0-9a-f]{64}$ ]]
          release_tool="$PAYLOAD/$release_tool_name"
          test -f "$release_tool"
          test "$(stat -c %s "$release_tool")" = "$release_tool_bytes"
          test "$(openssl dgst -sha256 "$release_tool" | awk '{print $NF}')" = "$release_tool_sha256"
          {
            printf 'release_tag=%s\n' "$release_tag"
            printf 'version=%s\n' "$version"
            printf 'candidate_commit=%s\n' "$candidate_commit"
            printf 'release_tool=%s\n' "$release_tool"
          } >> "$GITHUB_OUTPUT"
      - name: Revalidate every transported candidate byte and policy
        id: candidate
        env:
          PAYLOAD: ${{ steps.paths.outputs.payload }}
          CANDIDATE_OUTPUTS: ${{ steps.paths.outputs.candidate_outputs }}
          VERIFICATION: ${{ steps.paths.outputs.verification }}
          CANDIDATE_COMMIT: ${{ steps.identity.outputs.candidate_commit }}
          RELEASE_TAG: ${{ steps.identity.outputs.release_tag }}
          RELEASE_TOOL: ${{ steps.identity.outputs.release_tool }}
        run: |
          java -jar "$RELEASE_TOOL" verify-candidate \
            --repository "$GITHUB_WORKSPACE" \
            --manifest "$PAYLOAD/candidate-manifest.json" \
            --payload "$PAYLOAD" \
            --version "${RELEASE_TAG#v}" \
            --tag "$RELEASE_TAG" \
            --commit "$CANDIDATE_COMMIT" \
            --verification-output "$VERIFICATION" \
            --github-output "$CANDIDATE_OUTPUTS"
          cat "$CANDIDATE_OUTPUTS" >> "$GITHUB_OUTPUT"
      - name: Prepare or recover the exact Central deployment
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          PAYLOAD: ${{ steps.paths.outputs.payload }}
          CENTRAL_BUNDLE: ${{ steps.candidate.outputs.centralBundle }}
          RECORD: ${{ steps.paths.outputs.record }}
          RELEASE_TOOL: ${{ steps.identity.outputs.release_tool }}
        run: >-
          java -jar "$RELEASE_TOOL" central-prepare
          --bundle "$PAYLOAD/$CENTRAL_BUNDLE"
          --candidate "$PAYLOAD/candidate-manifest.json"
          --record "$RECORD"
          --allow-new-upload true
      - name: Await validation of that exact deployment
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          PAYLOAD: ${{ steps.paths.outputs.payload }}
          CENTRAL_BUNDLE: ${{ steps.candidate.outputs.centralBundle }}
          RECORD: ${{ steps.paths.outputs.record }}
          RELEASE_TOOL: ${{ steps.identity.outputs.release_tool }}
        run: >-
          java -jar "$RELEASE_TOOL" central-await
          --bundle "$PAYLOAD/$CENTRAL_BUNDLE"
          --candidate "$PAYLOAD/candidate-manifest.json"
          --record "$RECORD"
      - name: Publish Central first and await PUBLISHED
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          PAYLOAD: ${{ steps.paths.outputs.payload }}
          CENTRAL_BUNDLE: ${{ steps.candidate.outputs.centralBundle }}
          RECORD: ${{ steps.paths.outputs.record }}
          RELEASE_TOOL: ${{ steps.identity.outputs.release_tool }}
        run: >-
          java -jar "$RELEASE_TOOL" central-release
          --bundle "$PAYLOAD/$CENTRAL_BUNDLE"
          --candidate "$PAYLOAD/candidate-manifest.json"
          --record "$RECORD"
      - name: Create or reuse the exact GitHub release after Central
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_COMMIT: ${{ steps.identity.outputs.candidate_commit }}
          RELEASE_TAG: ${{ steps.identity.outputs.release_tag }}
        run: |
          error_file="$RUNNER_TEMP/release-view-error.txt"
          if draft=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>"$error_file"); then
            test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)" = "$EXPECTED_COMMIT"
          elif grep -Eqi 'HTTP 404|release not found' "$error_file"; then
            tag_error="$RUNNER_TEMP/release-tag-error.txt"
            if tag_commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha 2>"$tag_error"); then
              test "$tag_commit" = "$EXPECTED_COMMIT"
              gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
                --verify-tag --title "codex-agent $RELEASE_TAG" --generate-notes --draft
            elif grep -Eqi 'HTTP 404|No commit found' "$tag_error"; then
              gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
                --target "$EXPECTED_COMMIT" --title "codex-agent $RELEASE_TAG" --generate-notes --draft
            else
              cat "$tag_error" >&2
              exit 1
            fi
            draft=true
          else
            cat "$error_file" >&2
            exit 1
          fi
          printf 'draft=%s\n' "$draft" >> "$GITHUB_OUTPUT"
      - name: Attach exact candidate assets and compare official digests
        env:
          GH_TOKEN: ${{ github.token }}
          PAYLOAD: ${{ steps.paths.outputs.payload }}
          RECORD: ${{ steps.paths.outputs.record }}
          RELEASE_TAG: ${{ steps.identity.outputs.release_tag }}
          SWIFT_ASSET: ${{ steps.candidate.outputs.swiftAsset }}
          RELEASE_IS_DRAFT: ${{ steps.release.outputs.draft }}
        run: |
          if [ "$RELEASE_IS_DRAFT" = true ]; then
            gh release upload "$RELEASE_TAG" "$RECORD" "$PAYLOAD/$SWIFT_ASSET" \
              "$PAYLOAD/$SWIFT_ASSET.sha256" "$PAYLOAD/candidate-manifest.json" \
              --repo "$GITHUB_REPOSITORY" --clobber
          fi
          release_json=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")
          test "$(jq '.assets | length' <<<"$release_json")" -eq 4
          while IFS='|' read -r asset_name asset_path; do
            expected_digest="sha256:$(openssl dgst -sha256 "$asset_path" | awk '{print $NF}')"
            asset_count=$(jq --arg asset_name "$asset_name" \
              '[.assets[] | select(.name == $asset_name)] | length' <<<"$release_json")
            test "$asset_count" -eq 1
            api_digest=$(jq -r --arg asset_name "$asset_name" \
              '.assets[] | select(.name == $asset_name) | .digest' <<<"$release_json")
            test "$api_digest" = "$expected_digest"
          done <<EOF
          $SWIFT_ASSET|$PAYLOAD/$SWIFT_ASSET
          $SWIFT_ASSET.sha256|$PAYLOAD/$SWIFT_ASSET.sha256
          candidate-manifest.json|$PAYLOAD/candidate-manifest.json
          central-deployment.json|$RECORD
          EOF
      - name: Publish and verify the exact GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_COMMIT: ${{ steps.identity.outputs.candidate_commit }}
          RELEASE_TAG: ${{ steps.identity.outputs.release_tag }}
          RELEASE_IS_DRAFT: ${{ steps.release.outputs.draft }}
        run: |
          [ "$RELEASE_IS_DRAFT" != true ] || gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)" = "$EXPECTED_COMMIT"
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = false
      - name: Upload core publication evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          overwrite: true
          name: codex-agent-publication-core-${{ github.event.workflow_run.head_sha }}
          path: |
            ${{ steps.paths.outputs.identity }}/candidate-identity.txt
            ${{ steps.paths.outputs.record }}
            ${{ steps.paths.outputs.verification }}
            ${{ steps.paths.outputs.payload }}/candidate-manifest.json
          retention-days: 90

  swift-resolution:
    needs: publish-core
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.publish-core.outputs.candidate_commit }}
      - name: Resolve the public Swift package without compiling it
        env:
          RELEASE_TAG: ${{ needs.publish-core.outputs.release_tag }}
        run: |
          swift package --package-path codex-agent-runtime-ios/apple/RemoteConsumer \
            --scratch-path "$RUNNER_TEMP/swift-resolution" resolve
          resolved=codex-agent-runtime-ios/apple/RemoteConsumer/Package.resolved
          test -f "$resolved"
          mkdir -p build/reports/release-candidate
          digest=$(openssl dgst -sha256 "$resolved" | awk '{print $NF}')
          printf '{"schemaVersion":1,"result":"passed","releaseTag":"%s","packageResolvedSha256":"%s"}\n' \
            "$RELEASE_TAG" "$digest" > build/reports/release-candidate/public-swift-resolution.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          overwrite: true
          name: codex-agent-swift-resolution-${{ needs.publish-core.outputs.candidate_commit }}
          path: build/reports/release-candidate/public-swift-resolution.json
          retention-days: 90
