name: Publish Maven Central

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify build logic
        run: ./gradlew -p buildSrc test --stacktrace
      - name: Verify release metadata
        run: ./gradlew verifyReleaseMetadata -PcodexAgent.releaseTag="$GITHUB_RELEASE_TAG" --stacktrace
        env:
          GITHUB_RELEASE_TAG: ${{ github.event.release.tag_name }}
      - name: Verify client and Android repository
        run: ./gradlew verifyRepository --stacktrace
      - name: Install pinned Rust toolchain
        run: >-
          rustup toolchain install 1.95.0 --profile minimal
          --target aarch64-apple-ios,aarch64-apple-ios-sim
      - name: Verify embedded iOS runtime and Apple package
        run: ./gradlew verifyIosRuntime --stacktrace
      - name: Build a clean remote SwiftPM consumer
        working-directory: codex-agent-runtime-ios/apple/RemoteConsumer
        run: >-
          xcodebuild -scheme CodexAgentRemoteConsumer
          -configuration Release
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/codex-agent-remote-derived-data"
          -clonedSourcePackagesDirPath "$RUNNER_TEMP/codex-agent-remote-packages"
          CODE_SIGNING_ALLOWED=NO clean build
      - run: ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache --stacktrace
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
