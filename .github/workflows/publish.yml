name: Publish verified release

on:
  workflow_run:
    workflows: [Release candidate]
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: macos-26
    timeout-minutes: 180
    environment: release-publication
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Resolve publication paths
        id: paths
        run: |
          {
            printf 'payload=%s\n' "$RUNNER_TEMP/verified-candidate"
            printf 'identity=%s\n' "$RUNNER_TEMP/candidate-identity"
            printf 'record=%s\n' "$RUNNER_TEMP/central-deployment.json"
            printf 'candidate_outputs=%s\n' "$RUNNER_TEMP/candidate-outputs.txt"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          name: codex-agent-candidate-identity-${{ github.event.workflow_run.run_attempt }}
          path: ${{ steps.paths.outputs.identity }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          name: codex-agent-protected-candidate-${{ github.event.workflow_run.run_attempt }}
          path: ${{ steps.paths.outputs.payload }}
      - name: Verify and derive version and tag from candidate identity
        id: identity
        env:
          IDENTITY: ${{ steps.paths.outputs.identity }}/candidate-identity.txt
          WORKFLOW_COMMIT: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        shell: bash
        run: |
          exec 3<"$IDENTITY"
          IFS= read -r candidate_line <&3
          IFS= read -r release_line <&3
          IFS= read -r commit_line <&3
          IFS= read -r run_line <&3
          IFS= read -r attempt_line <&3
          if IFS= read -r extra <&3; then
            printf 'Unexpected candidate identity line: %s\n' "$extra" >&2
            exit 1
          fi
          exec 3<&-
          candidate_tag="${candidate_line#candidateTag=}"
          release_tag="${release_line#releaseTag=}"
          candidate_commit="${commit_line#candidateCommit=}"
          candidate_run_id="${run_line#candidateRunId=}"
          candidate_run_attempt="${attempt_line#candidateRunAttempt=}"
          test "$candidate_line" = "candidateTag=$candidate_tag"
          test "$release_line" = "releaseTag=$release_tag"
          test "$commit_line" = "candidateCommit=$candidate_commit"
          test "$run_line" = "candidateRunId=$candidate_run_id"
          test "$attempt_line" = "candidateRunAttempt=$candidate_run_attempt"
          [[ "$candidate_tag" =~ ^candidate/v([0-9]+\.[0-9]+\.[0-9]+)-rc\.([1-9][0-9]*)$ ]]
          version="${BASH_REMATCH[1]}"
          test "$release_tag" = "v$version"
          [[ "$candidate_commit" =~ ^[0-9a-f]{40}$ ]]
          test "$candidate_commit" = "$WORKFLOW_COMMIT"
          [[ "$candidate_run_id" =~ ^[1-9][0-9]*$ ]]
          [[ "$candidate_run_attempt" =~ ^[1-9][0-9]*$ ]]
          test "$candidate_run_id" = "$WORKFLOW_RUN_ID"
          test "$candidate_run_attempt" = "$WORKFLOW_RUN_ATTEMPT"
          git fetch --no-tags --force origin \
            "refs/tags/$candidate_tag:refs/tags/$candidate_tag"
          test "$(git rev-parse "refs/tags/$candidate_tag^{commit}")" = "$candidate_commit"
          {
            printf 'release_tag=%s\n' "$release_tag"
            printf 'version=%s\n' "$version"
            printf 'candidate_commit=%s\n' "$candidate_commit"
          } >> "$GITHUB_OUTPUT"
      - name: Verify the transported candidate and emit exact names
        id: candidate
        env:
          PAYLOAD: ${{ steps.paths.outputs.payload }}
          CANDIDATE_OUTPUTS: ${{ steps.paths.outputs.candidate_outputs }}
          CANDIDATE_COMMIT: ${{ steps.identity.outputs.candidate_commit }}
          RELEASE_TAG: ${{ steps.identity.outputs.release_tag }}
        run: |
          ./gradlew verifyCandidatePayload \
            -PcodexAgent.candidateManifest="$PAYLOAD/candidate-manifest.json" \
            -PcodexAgent.candidatePayload="$PAYLOAD" \
            -PcodexAgent.candidateCommit="$CANDIDATE_COMMIT" \
            -PcodexAgent.releaseTag="$RELEASE_TAG" \
            -PcodexAgent.githubOutputFile="$CANDIDATE_OUTPUTS" \
            --no-daemon --stacktrace
          cat "$CANDIDATE_OUTPUTS" >> "$GITHUB_OUTPUT"
      - name: Recheck publication approvals after protected-environment approval
        run: ./gradlew verifyPublicationReadiness --no-daemon --stacktrace
      - name: Prepare or recover the exact Central deployment
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          PAYLOAD: ${{ steps.paths.outputs.payload }}
          CENTRAL_BUNDLE: ${{ steps.candidate.outputs.centralBundle }}
          RECORD: ${{ steps.paths.outputs.record }}
        run: >-
          ./gradlew prepareCentralDeployment
          -PcodexAgent.centralBundle="$PAYLOAD/$CENTRAL_BUNDLE"
          -PcodexAgent.candidateManifest="$PAYLOAD/candidate-manifest.json"
          -PcodexAgent.centralDeploymentRecord="$RECORD"
          -PcodexAgent.allowCentralUpload=true
          --no-daemon --no-configuration-cache --stacktrace
      - name: Await validation of that deployment
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          PAYLOAD: ${{ steps.paths.outputs.payload }}
          CENTRAL_BUNDLE: ${{ steps.candidate.outputs.centralBundle }}
          RECORD: ${{ steps.paths.outputs.record }}
        run: >-
          ./gradlew awaitCentralValidation
          -PcodexAgent.centralBundle="$PAYLOAD/$CENTRAL_BUNDLE"
          -PcodexAgent.candidateManifest="$PAYLOAD/candidate-manifest.json"
          -PcodexAgent.centralDeploymentRecord="$RECORD"
          --no-daemon --no-configuration-cache --stacktrace
      - name: Publish Central first and await PUBLISHED
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          PAYLOAD: ${{ steps.paths.outputs.payload }}
          CENTRAL_BUNDLE: ${{ steps.candidate.outputs.centralBundle }}
          RECORD: ${{ steps.paths.outputs.record }}
        run: >-
          ./gradlew releaseCentralDeployment
          -PcodexAgent.centralBundle="$PAYLOAD/$CENTRAL_BUNDLE"
          -PcodexAgent.candidateManifest="$PAYLOAD/candidate-manifest.json"
          -PcodexAgent.centralDeploymentRecord="$RECORD"
          --no-daemon --no-configuration-cache --stacktrace
      - name: Create or reuse the exact GitHub release after Central
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_COMMIT: ${{ steps.identity.outputs.candidate_commit }}
          RELEASE_TAG: ${{ steps.identity.outputs.release_tag }}
        run: |
          error_file="$RUNNER_TEMP/release-view-error.txt"
          if draft=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>"$error_file"); then
            test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)" = "$EXPECTED_COMMIT"
          elif grep -Eqi 'HTTP 404|release not found' "$error_file"; then
            tag_error="$RUNNER_TEMP/release-tag-error.txt"
            if tag_commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha 2>"$tag_error"); then
              test "$tag_commit" = "$EXPECTED_COMMIT"
              gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
                --verify-tag --title "codex-agent $RELEASE_TAG" --generate-notes --draft
            elif grep -Eqi 'HTTP 404|No commit found' "$tag_error"; then
              gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
                --target "$EXPECTED_COMMIT" --title "codex-agent $RELEASE_TAG" --generate-notes --draft
            else
              cat "$tag_error" >&2
              exit 1
            fi
            draft=true
          else
            cat "$error_file" >&2
            exit 1
          fi
          printf 'draft=%s\n' "$draft" >> "$GITHUB_OUTPUT"
      - name: Attach the exact Swift asset, manifest, and Central receipt
        env:
          GH_TOKEN: ${{ github.token }}
          PAYLOAD: ${{ steps.paths.outputs.payload }}
          RECORD: ${{ steps.paths.outputs.record }}
          RELEASE_TAG: ${{ steps.identity.outputs.release_tag }}
          SWIFT_ASSET: ${{ steps.candidate.outputs.swiftAsset }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "$RECORD" "$PAYLOAD/$SWIFT_ASSET" "$PAYLOAD/candidate-manifest.json" \
            --repo "$GITHUB_REPOSITORY" --clobber
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$SWIFT_ASSET" --dir "$RUNNER_TEMP" --clobber
          cmp "$PAYLOAD/$SWIFT_ASSET" "$RUNNER_TEMP/$SWIFT_ASSET"
      - name: Publish the exact GitHub release
        if: steps.release.outputs.draft == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.identity.outputs.release_tag }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
      - name: Verify the published GitHub release identity
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_COMMIT: ${{ steps.identity.outputs.candidate_commit }}
          RELEASE_TAG: ${{ steps.identity.outputs.release_tag }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)" = "$EXPECTED_COMMIT"
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = false
      - name: Verify public SwiftPM asset and clean resolution
        env:
          PAYLOAD: ${{ steps.paths.outputs.payload }}
        run: >-
          ./gradlew verifyPublicSwiftResolution
          -PcodexAgent.candidateManifest="$PAYLOAD/candidate-manifest.json"
          --no-daemon --stacktrace
      - name: Upload publication evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          if-no-files-found: error
          overwrite: true
          name: codex-agent-${{ steps.identity.outputs.release_tag }}-publication
          path: |
            ${{ steps.paths.outputs.identity }}/candidate-identity.txt
            ${{ steps.paths.outputs.record }}
            build/reports/release-candidate/payload-verification.json
            build/reports/release-candidate/public-swift-resolution.json
            ${{ steps.paths.outputs.payload }}/candidate-manifest.json
          retention-days: 90
