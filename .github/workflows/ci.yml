name: CI

on:
  pull_request:

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.3"
          cache: false
      - id: actionlint-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin/actionlint
          key: actionlint-v1-${{ runner.os }}-${{ runner.arch }}-v1.7.12
      - if: steps.actionlint-cache.outputs.cache-hit != 'true'
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - run: |
          "$HOME/go/bin/actionlint"
      - if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          steps.actionlint-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin/actionlint
          key: ${{ steps.actionlint-cache.outputs.cache-primary-key }}

  android-jvm:
    needs: workflow-lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: build
        uses: ./.github/actions/setup-kmp
        with:
          cache-read-only: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
          cache-encryption-key: >-
            ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' &&
            secrets.GRADLE_ENCRYPTION_KEY || '' }}
          node-version: "24.18.0"
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - run: ./gradlew -p gradle/build-logic test --parallel --stacktrace
      - run: ./gradlew verifyRepository --parallel --stacktrace
      - name: Package exact reusable runners and Android binaries
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: >-
          ./gradlew
          :codex-agent-runtime-desktop:packageJvmRuntimeEvidenceRunner
          :codex-agent-runtime-node:packageNodeRuntimeEvidenceRunner
          :codex-agent-runtime-node:packageNodeWasmRuntimeEvidenceRunner
          :tooling:android-runtime-evidence:assembleDebug
          :tooling:android-runtime-evidence:assembleDebugAndroidTest
          :codex-agent-runtime-android:testDebugUnitTest
          :codex-agent-runtime-android:lintRelease
          :codex-agent-runtime-android:assembleRelease
          --parallel --stacktrace
      - name: Stage the three portable runners as one flat import
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p build/ci-portable-runtime-artifacts
          cp codex-agent-runtime-desktop/build/distributions/codex-agent-jvm-runtime-evidence-runner.zip \
            codex-agent-runtime-node/build/distributions/codex-agent-node-runtime-evidence-runner.zip \
            codex-agent-runtime-node/build/distributions/codex-agent-node-wasm-runtime-evidence-runner.zip \
            build/ci-portable-runtime-artifacts/
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          overwrite: true
          name: codex-agent-ci-portable-runtime-artifacts-${{ github.sha }}
          path: build/ci-portable-runtime-artifacts/*
          compression-level: 0
          retention-days: 30
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          overwrite: true
          name: codex-agent-ci-android-binaries-${{ github.sha }}
          path: |
            tooling/android-runtime-evidence/build/outputs/apk/debug/android-runtime-evidence-debug.apk
            tooling/android-runtime-evidence/build/outputs/apk/androidTest/debug/android-runtime-evidence-debug-androidTest.apk
            codex-agent-runtime-android/build/outputs/aar/codex-agent-runtime-android-release.aar
          compression-level: 0
          retention-days: 30
      - if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          steps.build.outputs.konan-cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: ${{ steps.build.outputs.konan-cache-primary-key }}

  apple-runtime-evidence:
    needs: workflow-lint
    uses: ./.github/workflows/apple-runtime-evidence.yml
    with:
      candidateCommit: ${{ github.sha }}
      trustedCacheWriter: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    secrets: inherit

  desktop-runtime-evidence:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [workflow-lint, android-jvm]
    uses: ./.github/workflows/desktop-runtime-evidence.yml
    with:
      candidateCommit: ${{ github.sha }}
      trustedCacheWriter: true
    secrets: inherit
