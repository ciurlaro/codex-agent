name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  workflow-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
      - run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - run: actionlint

  android-jvm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew -p buildSrc test --stacktrace
      - run: ./gradlew verifyRepository --stacktrace

  ios:
    runs-on: macos-26
    timeout-minutes: 240
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :codex-agent-runtime-ios:verifyAppleToolchain --stacktrace
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
          components: llvm-tools-preview
      - run: ./gradlew verifyIosRuntime --stacktrace
      - name: Upload iOS verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-agent-ios-verification
          if-no-files-found: warn
          path: |
            codex-agent-runtime-ios/build/reports/ios-release/**
            codex-agent-runtime-ios/build/swift-authentication-tests.xcresult
            codex-agent-runtime-ios/build/swift-authentication-tests-summary.json
