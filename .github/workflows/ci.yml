name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  android-jvm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew -p buildSrc test --stacktrace
      - run: ./gradlew verifyRepository --stacktrace

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: >-
          ./gradlew
          :codex-agent-client:compileKotlinIosArm64
          :codex-agent-client:compileKotlinIosSimulatorArm64
          --stacktrace
