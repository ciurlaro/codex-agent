name: Apple Runtime Evidence

on:
  workflow_call:
    inputs:
      planArtifact:
        required: true
        type: string
      validationCommit:
        required: true
        type: string
      validationTree:
        required: true
        type: string

permissions:
  actions: read
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  select:
    runs-on: ubuntu-24.04
    outputs:
      native: ${{ steps.lanes.outputs.ios_native_tests }}
      native_test: ${{ steps.lanes.outputs.ios_native_tests_test }}
      rust_device: ${{ steps.lanes.outputs.ios_rust_device }}
      rust_device_build: ${{ steps.lanes.outputs.ios_rust_device_build }}
      rust_simulator: ${{ steps.lanes.outputs.ios_rust_simulator }}
      rust_simulator_build: ${{ steps.lanes.outputs.ios_rust_simulator_build }}
      framework_device: ${{ steps.lanes.outputs.ios_framework_device }}
      framework_device_build: ${{ steps.lanes.outputs.ios_framework_device_build }}
      framework_simulator: ${{ steps.lanes.outputs.ios_framework_simulator }}
      framework_simulator_build: ${{ steps.lanes.outputs.ios_framework_simulator_build }}
      kotlin: ${{ steps.lanes.outputs.ios_kotlin_tests }}
      kotlin_test: ${{ steps.lanes.outputs.ios_kotlin_tests_test }}
      swift_build: ${{ steps.lanes.outputs.ios_swift_build }}
      swift_build_action: ${{ steps.lanes.outputs.ios_swift_build_build }}
      swift_build_test: ${{ steps.lanes.outputs.ios_swift_build_test }}
      swift_tests: ${{ steps.lanes.outputs.ios_swift_tests }}
      swift_tests_test: ${{ steps.lanes.outputs.ios_swift_tests_test }}
      package: ${{ steps.lanes.outputs.ios_package }}
      package_build: ${{ steps.lanes.outputs.ios_package_build }}
      privacy: ${{ steps.lanes.outputs.ios_privacy_metrics }}
      privacy_test: ${{ steps.lanes.outputs.ios_privacy_metrics_test }}
      consumer_common: ${{ steps.lanes.outputs.consumer_common }}
      consumer_common_build: ${{ steps.lanes.outputs.consumer_common_build }}
      consumer_device: ${{ steps.lanes.outputs.consumer_ios_device }}
      consumer_device_build: ${{ steps.lanes.outputs.consumer_ios_device_build }}
      consumer_simulator: ${{ steps.lanes.outputs.consumer_ios_simulator }}
      consumer_simulator_build: ${{ steps.lanes.outputs.consumer_ios_simulator_build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.validationCommit }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.planArtifact }}
          path: build/ci
      - id: lanes
        run: >-
          python3 ci/lane_selection.py --plan build/ci/impact-plan.json --github-output "$GITHUB_OUTPUT"
          --lane ios-native-tests --lane ios-rust-device --lane ios-rust-simulator
          --lane ios-framework-device --lane ios-framework-simulator --lane ios-kotlin-tests
          --lane ios-swift-build --lane ios-swift-tests --lane ios-package
          --lane ios-privacy-metrics --lane consumer-common
          --lane consumer-ios-device --lane consumer-ios-simulator

  native-tests:
    if: needs.select.outputs.native == 'true'
    needs: select
    runs-on: macos-26
    timeout-minutes: 90
    outputs:
      artifact_name: ${{ steps.lane.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.validationCommit }}
      - id: lane
        uses: ./.github/actions/run-ci-lane
        with:
          lane: ios-native-tests
          plan-artifact: ${{ inputs.planArtifact }}
          validation-commit: ${{ inputs.validationCommit }}
          validation-tree: ${{ inputs.validationTree }}
          rust-version: "1.95.0"
          xcode-version: "26.6"

  rust-device:
    if: needs.select.outputs.rust_device == 'true'
    needs: select
    runs-on: macos-26
    timeout-minutes: 120
    outputs:
      artifact_name: ${{ steps.lane.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.validationCommit }}
      - id: lane
        uses: ./.github/actions/run-ci-lane
        with:
          lane: ios-rust-device
          plan-artifact: ${{ inputs.planArtifact }}
          validation-commit: ${{ inputs.validationCommit }}
          validation-tree: ${{ inputs.validationTree }}
          rust-version: "1.95.0"
          xcode-version: "26.6"

  rust-simulator:
    if: needs.select.outputs.rust_simulator == 'true'
    needs: select
    runs-on: macos-26
    timeout-minutes: 120
    outputs:
      artifact_name: ${{ steps.lane.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.validationCommit }}
      - id: lane
        uses: ./.github/actions/run-ci-lane
        with:
          lane: ios-rust-simulator
          plan-artifact: ${{ inputs.planArtifact }}
          validation-commit: ${{ inputs.validationCommit }}
          validation-tree: ${{ inputs.validationTree }}
          rust-version: "1.95.0"
          xcode-version: "26.6"

  framework-device:
    if: always() && needs.select.outputs.framework_device == 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    needs: [select, rust-device]
    runs-on: macos-26
    timeout-minutes: 120
    outputs:
      artifact_name: ${{ steps.lane.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.validationCommit }}
      - if: needs.select.outputs.framework_device_build == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.rust-device.outputs.artifact_name }}
          path: build/ci/device-rust
      - if: needs.select.outputs.framework_device_build == 'true'
        shell: bash
        run: |
          archive=$(find build/ci/device-rust/payload -type f -name codex-agent-ios-arm64.a -print -quit)
          test -n "$archive"
          printf 'IOS_DEVICE_RUST_EVIDENCE=%s/%s\n' "$GITHUB_WORKSPACE" "$(dirname "$archive")" >> "$GITHUB_ENV"
      - id: lane
        uses: ./.github/actions/run-ci-lane
        with:
          lane: ios-framework-device
          plan-artifact: ${{ inputs.planArtifact }}
          validation-commit: ${{ inputs.validationCommit }}
          validation-tree: ${{ inputs.validationTree }}
          rust-version: "1.95.0"
          xcode-version: "26.6"

  framework-simulator:
    if: always() && needs.select.outputs.framework_simulator == 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    needs: [select, rust-simulator]
    runs-on: macos-26
    timeout-minutes: 120
    outputs:
      artifact_name: ${{ steps.lane.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.validationCommit }}
      - if: needs.select.outputs.framework_simulator_build == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.rust-simulator.outputs.artifact_name }}
          path: build/ci/simulator-rust
      - if: needs.select.outputs.framework_simulator_build == 'true'
        shell: bash
        run: |
          archive=$(find build/ci/simulator-rust/payload -type f -name codex-agent-ios-simulator-arm64.a -print -quit)
          test -n "$archive"
          printf 'IOS_SIMULATOR_RUST_EVIDENCE=%s/%s\n' "$GITHUB_WORKSPACE" "$(dirname "$archive")" >> "$GITHUB_ENV"
      - id: lane
        uses: ./.github/actions/run-ci-lane
        with:
          lane: ios-framework-simulator
          plan-artifact: ${{ inputs.planArtifact }}
          validation-commit: ${{ inputs.validationCommit }}
          validation-tree: ${{ inputs.validationTree }}
          rust-version: "1.95.0"
          xcode-version: "26.6"

  kotlin-tests:
    if: always() && needs.select.outputs.kotlin == 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    needs: [select, rust-simulator]
    runs-on: macos-26
    timeout-minutes: 90
    outputs:
      artifact_name: ${{ steps.lane.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.validationCommit }}
      - if: needs.select.outputs.kotlin_test == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.rust-simulator.outputs.artifact_name }}
          path: build/ci/simulator-rust
      - if: needs.select.outputs.kotlin_test == 'true'
        run: |
          archive=$(find build/ci/simulator-rust/payload -type f -name codex-agent-ios-simulator-arm64.a -print -quit)
          test -n "$archive"
          evidence=$(dirname "$archive")
          printf 'IOS_SIMULATOR_RUST_EVIDENCE=%s/%s\n' "$GITHUB_WORKSPACE" "$evidence" >> "$GITHUB_ENV"
      - id: lane
        uses: ./.github/actions/run-ci-lane
        with:
          lane: ios-kotlin-tests
          plan-artifact: ${{ inputs.planArtifact }}
          validation-commit: ${{ inputs.validationCommit }}
          validation-tree: ${{ inputs.validationTree }}
          rust-version: "1.95.0"
          xcode-version: "26.6"

  swift-build:
    if: always() && needs.select.outputs.swift_build == 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    needs: [select, framework-simulator]
    runs-on: macos-26
    timeout-minutes: 90
    outputs:
      artifact_name: ${{ steps.lane.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.validationCommit }}
      - if: needs.select.outputs.swift_build_action == 'true' || needs.select.outputs.swift_build_test == 'true' || needs.select.outputs.swift_tests_test == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.framework-simulator.outputs.artifact_name }}
          path: build/ci/framework
      - if: needs.select.outputs.swift_build_action == 'true' || needs.select.outputs.swift_build_test == 'true' || needs.select.outputs.swift_tests_test == 'true'
        run: |
          framework=$(find build/ci/framework/payload -type d -name CodexAgent.framework -print -quit)
          test -n "$framework"
          printf 'IOS_SIMULATOR_FRAMEWORK=%s/%s\n' "$GITHUB_WORKSPACE" "$framework" >> "$GITHUB_ENV"
      - id: lane
        uses: ./.github/actions/run-ci-lane
        with:
          lane: ios-swift-build
          plan-artifact: ${{ inputs.planArtifact }}
          validation-commit: ${{ inputs.validationCommit }}
          validation-tree: ${{ inputs.validationTree }}
          xcode-version: "26.6"

  swift-tests:
    if: always() && needs.select.outputs.swift_tests == 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    needs: [select, framework-device, framework-simulator, swift-build]
    runs-on: macos-26
    timeout-minutes: 90
    outputs:
      artifact_name: ${{ steps.lane.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.validationCommit }}
      - if: needs.select.outputs.swift_tests_test == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.framework-device.outputs.artifact_name }}
          path: build/ci/device-framework
      - if: needs.select.outputs.swift_tests_test == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.framework-simulator.outputs.artifact_name }}
          path: build/ci/simulator-framework
      - if: needs.select.outputs.swift_tests_test == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.swift-build.outputs.artifact_name }}
          path: build/ci/swift-compilation
      - if: needs.select.outputs.swift_tests_test == 'true'
        run: |
          device=$(find build/ci/device-framework/payload -type d -name CodexAgent.framework -print -quit)
          simulator=$(find build/ci/simulator-framework/payload -type d -name CodexAgent.framework -print -quit)
          compilation_archive=$(find build/ci/swift-compilation/payload -type f -name swift-simulator-compilation-products.tar -print -quit)
          test -n "$device"
          test -n "$simulator"
          test -n "$compilation_archive"
          python3 ci/stage.py extract-tar --archive "$compilation_archive" --output build/ci/swift-products
          compilation=$(find build/ci/swift-products -type d -name swift-simulator-compilation-products -print -quit)
          test -n "$compilation"
          printf 'IOS_DEVICE_FRAMEWORK=%s/%s\nIOS_SIMULATOR_FRAMEWORK=%s/%s\nCODEX_AGENT_SWIFT_COMPILATION_DIRECTORY=%s/%s\n' \
            "$GITHUB_WORKSPACE" "$device" "$GITHUB_WORKSPACE" "$simulator" \
            "$GITHUB_WORKSPACE" "$compilation" >> "$GITHUB_ENV"
      - id: lane
        uses: ./.github/actions/run-ci-lane
        with:
          lane: ios-swift-tests
          plan-artifact: ${{ inputs.planArtifact }}
          validation-commit: ${{ inputs.validationCommit }}
          validation-tree: ${{ inputs.validationTree }}
          rust-version: "1.95.0"
          xcode-version: "26.6"

  package:
    if: always() && needs.select.outputs.package == 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    needs: [select, framework-device, framework-simulator]
    runs-on: macos-26
    timeout-minutes: 90
    outputs:
      artifact_name: ${{ steps.lane.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.validationCommit }}
      - if: needs.select.outputs.package_build == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.framework-device.outputs.artifact_name }}
          path: build/ci/device-framework
      - if: needs.select.outputs.package_build == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.framework-simulator.outputs.artifact_name }}
          path: build/ci/simulator-framework
      - if: needs.select.outputs.package_build == 'true'
        run: |
          device=$(find build/ci/device-framework/payload -type d -name CodexAgent.framework -print -quit)
          simulator=$(find build/ci/simulator-framework/payload -type d -name CodexAgent.framework -print -quit)
          test -n "$device"
          test -n "$simulator"
          printf 'IOS_DEVICE_FRAMEWORK=%s/%s\nIOS_SIMULATOR_FRAMEWORK=%s/%s\n' \
            "$GITHUB_WORKSPACE" "$device" "$GITHUB_WORKSPACE" "$simulator" >> "$GITHUB_ENV"
      - id: lane
        uses: ./.github/actions/run-ci-lane
        with:
          lane: ios-package
          plan-artifact: ${{ inputs.planArtifact }}
          validation-commit: ${{ inputs.validationCommit }}
          validation-tree: ${{ inputs.validationTree }}
          rust-version: "1.95.0"
          xcode-version: "26.6"

  privacy-metrics:
    if: always() && needs.select.outputs.privacy == 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    needs: [select, framework-device, framework-simulator, package, kotlin-tests, swift-tests]
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.validationCommit }}
      - if: needs.kotlin-tests.outputs.artifact_name != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.kotlin-tests.outputs.artifact_name }}
          path: build/ci/privacy-inputs/kotlin
      - if: needs.swift-tests.outputs.artifact_name != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.swift-tests.outputs.artifact_name }}
          path: build/ci/privacy-inputs/swift
      - if: needs.package.outputs.artifact_name != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.package.outputs.artifact_name }}
          path: build/ci/privacy-inputs/package
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.framework-device.outputs.artifact_name }}
          path: build/ci/privacy-inputs/device
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.framework-simulator.outputs.artifact_name }}
          path: build/ci/privacy-inputs/simulator
      - shell: bash
        run: |
          for payload in build/ci/privacy-inputs/*/payload; do
            test ! -d "$payload" || cp -R "$payload/." .
          done
          device=$(find build/ci/privacy-inputs/device/payload -type d -name CodexAgent.framework -print -quit)
          simulator=$(find build/ci/privacy-inputs/simulator/payload -type d -name CodexAgent.framework -print -quit)
          test -n "$device"
          test -n "$simulator"
          printf 'IOS_DEVICE_FRAMEWORK=%s/%s\nIOS_SIMULATOR_FRAMEWORK=%s/%s\n' \
            "$GITHUB_WORKSPACE" "$device" "$GITHUB_WORKSPACE" "$simulator" >> "$GITHUB_ENV"
      - uses: ./.github/actions/run-ci-lane
        with:
          lane: ios-privacy-metrics
          plan-artifact: ${{ inputs.planArtifact }}
          validation-commit: ${{ inputs.validationCommit }}
          validation-tree: ${{ inputs.validationTree }}
          rust-version: "1.95.0"
          xcode-version: "26.6"

  consumer-common:
    if: always() && needs.select.outputs.consumer_common == 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    needs: [select]
    runs-on: macos-26
    timeout-minutes: 180
    outputs:
      artifact_name: ${{ steps.lane.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.validationCommit }}
      - id: lane
        uses: ./.github/actions/run-ci-lane
        with:
          lane: consumer-common
          plan-artifact: ${{ inputs.planArtifact }}
          validation-commit: ${{ inputs.validationCommit }}
          validation-tree: ${{ inputs.validationTree }}
          node-version: "24.18.0"
          rust-version: "1.95.0"
          xcode-version: "26.6"

  consumer-ios-device:
    if: always() && needs.select.outputs.consumer_device == 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    needs: [select, rust-device, rust-simulator]
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.validationCommit }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.rust-device.outputs.artifact_name }}
          path: build/ci/consumer-rust/device
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.rust-simulator.outputs.artifact_name }}
          path: build/ci/consumer-rust/simulator
      - shell: bash
        run: |
          device=$(find build/ci/consumer-rust/device/payload -type f -name codex-agent-ios-arm64.a -print -quit)
          simulator=$(find build/ci/consumer-rust/simulator/payload -type f -name codex-agent-ios-simulator-arm64.a -print -quit)
          test -n "$device"
          test -n "$simulator"
          printf 'IOS_DEVICE_RUST_EVIDENCE=%s/%s\nIOS_SIMULATOR_RUST_EVIDENCE=%s/%s\n' \
            "$GITHUB_WORKSPACE" "$(dirname "$device")" "$GITHUB_WORKSPACE" "$(dirname "$simulator")" >> "$GITHUB_ENV"
      - uses: ./.github/actions/run-ci-lane
        with:
          lane: consumer-ios-device
          plan-artifact: ${{ inputs.planArtifact }}
          validation-commit: ${{ inputs.validationCommit }}
          validation-tree: ${{ inputs.validationTree }}
          rust-version: "1.95.0"
          xcode-version: "26.6"

  consumer-ios-simulator:
    if: always() && needs.select.outputs.consumer_simulator == 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    needs: [select, rust-device, rust-simulator]
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.validationCommit }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.rust-device.outputs.artifact_name }}
          path: build/ci/consumer-rust/device
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.rust-simulator.outputs.artifact_name }}
          path: build/ci/consumer-rust/simulator
      - shell: bash
        run: |
          device=$(find build/ci/consumer-rust/device/payload -type f -name codex-agent-ios-arm64.a -print -quit)
          simulator=$(find build/ci/consumer-rust/simulator/payload -type f -name codex-agent-ios-simulator-arm64.a -print -quit)
          test -n "$device"
          test -n "$simulator"
          printf 'IOS_DEVICE_RUST_EVIDENCE=%s/%s\nIOS_SIMULATOR_RUST_EVIDENCE=%s/%s\n' \
            "$GITHUB_WORKSPACE" "$(dirname "$device")" "$GITHUB_WORKSPACE" "$(dirname "$simulator")" >> "$GITHUB_ENV"
      - uses: ./.github/actions/run-ci-lane
        with:
          lane: consumer-ios-simulator
          plan-artifact: ${{ inputs.planArtifact }}
          validation-commit: ${{ inputs.validationCommit }}
          validation-tree: ${{ inputs.validationTree }}
          rust-version: "1.95.0"
