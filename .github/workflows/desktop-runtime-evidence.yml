name: Desktop Runtime Evidence

on:
  workflow_call:
    inputs:
      candidateCommit:
        required: true
        type: string
      trustedCacheWriter:
        required: true
        type: boolean
    secrets:
      GRADLE_ENCRYPTION_KEY:
        required: false

permissions:
  actions: read
  contents: read

concurrency:
  group: desktop-runtime-evidence-${{ inputs.candidateCommit }}
  cancel-in-progress: false

env:
  CANDIDATE_COMMIT: ${{ inputs.candidateCommit }}

jobs:
  runtime:
    name: ${{ matrix.target }} runtime
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: ${{ matrix.developerDir }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macosArm64
            runner: macos-26
            nativeTask: recordMacosArm64DesktopRuntimeEvidence
            jvmTask: recordJvmRuntimeMacosArm64Evidence
            nodeTask: nodeRuntimeMacosArm64Test
            wasmTask: nodeWasmRuntimeMacosArm64Test
            classifier: app-server-macos-arm64
            supervisor: codex-process-supervisor
            developerDir: /Applications/Xcode_26.6.app/Contents/Developer
          - target: macosX64
            runner: macos-26-intel
            nativeTask: recordMacosX64DesktopRuntimeEvidence
            jvmTask: recordJvmRuntimeMacosX64Evidence
            nodeTask: nodeRuntimeMacosX64Test
            wasmTask: nodeWasmRuntimeMacosX64Test
            classifier: app-server-macos-x64
            supervisor: codex-process-supervisor
            developerDir: /Applications/Xcode_26.6.app/Contents/Developer
          - target: linuxX64
            runner: ubuntu-24.04
            nativeTask: recordLinuxX64DesktopRuntimeEvidence
            jvmTask: recordJvmRuntimeLinuxX64Evidence
            nodeTask: nodeRuntimeLinuxX64Test
            wasmTask: nodeWasmRuntimeLinuxX64Test
            classifier: app-server-linux-x64
            supervisor: codex-process-supervisor
            developerDir: ""
          - target: mingwX64
            runner: windows-2025
            nativeTask: recordMingwX64DesktopRuntimeEvidence
            jvmTask: recordJvmRuntimeMingwX64Evidence
            nodeTask: nodeRuntimeMingwX64Test
            wasmTask: nodeWasmRuntimeMingwX64Test
            classifier: app-server-windows-x64
            supervisor: codex-process-supervisor.exe
            developerDir: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ inputs.candidateCommit }}
      - id: build
        uses: ./.github/actions/setup-kmp
        with:
          cache-read-only: ${{ !inputs.trustedCacheWriter || matrix.target != 'mingwX64' }}
          cache-encryption-key: ${{ inputs.trustedCacheWriter && secrets.GRADLE_ENCRYPTION_KEY || '' }}
          node-version: "24.18.0"
          xcode-fingerprint: ${{ startsWith(matrix.target, 'macos') && 'auto' || 'none' }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: codex-agent-ci-portable-runtime-artifacts-${{ inputs.candidateCommit }}
          path: build/portable-runtime-artifacts
      - uses: ./.github/actions/setup-msvc
      - name: Record native evidence and build one classifier with its supervisor
        shell: bash
        run: >-
          ./gradlew :codex-agent-runtime-desktop:${{ matrix.nativeTask }}
          -PcodexAgent.candidateCommit="$CANDIDATE_COMMIT"
          -PcodexAgent.desktopEvidenceTarget=${{ matrix.target }}
          --parallel --stacktrace
      - name: Resolve the exact classifier and preserve its supervisor
        id: classifier
        shell: bash
        run: |
          shopt -s nullglob
          archives=(codex-agent-runtime-desktop/build/distributions/*-${{ matrix.classifier }}.zip)
          test "${#archives[@]}" -eq 1
          supervisor="codex-agent-runtime-desktop/build/supervisor/${{ matrix.target }}/${{ matrix.supervisor }}"
          test -x "$supervisor"
          printf 'archive=%s/%s\n' "$GITHUB_WORKSPACE" "${archives[0]}" >> "$GITHUB_OUTPUT"
      - name: Run JVM, Node JS, and Node Wasm against that classifier
        shell: bash
        run: >-
          ./gradlew
          :codex-agent-runtime-desktop:${{ matrix.jvmTask }}
          :codex-agent-runtime-node:${{ matrix.nodeTask }}
          :codex-agent-runtime-node:${{ matrix.wasmTask }}
          -PcodexAgent.candidateCommit="$CANDIDATE_COMMIT"
          -PcodexAgent.desktopEvidenceTarget=${{ matrix.target }}
          -PcodexAgent.jvmClassifierArchive="${{ steps.classifier.outputs.archive }}"
          -PcodexAgent.jvmRuntimeEvidenceRunner="$PWD/build/portable-runtime-artifacts/codex-agent-jvm-runtime-evidence-runner.zip"
          -PcodexAgent.nodeClassifierArchive="${{ steps.classifier.outputs.archive }}"
          -PcodexAgent.nodeRuntimeEvidenceRunnerArchive="$PWD/build/portable-runtime-artifacts/codex-agent-node-runtime-evidence-runner.zip"
          -PcodexAgent.nodeWasmRuntimeEvidenceRunnerArchive="$PWD/build/portable-runtime-artifacts/codex-agent-node-wasm-runtime-evidence-runner.zip"
          -PcodexAgent.desktopDistributionManifest="$PWD/codex-agent-runtime-desktop/codex-app-server-distributions.json"
          --parallel --stacktrace
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          if-no-files-found: error
          overwrite: true
          name: codex-agent-ci-runtime-evidence-${{ matrix.target }}-${{ inputs.candidateCommit }}
          path: |
            codex-agent-runtime-desktop/build/reports/desktop-runtime-evidence/desktop-runtime-${{ matrix.target }}.json
            codex-agent-runtime-desktop/build/reports/jvm-runtime-evidence/jvm-runtime-${{ matrix.target }}.json
            codex-agent-runtime-node/build/reports/node-runtime-evidence/node-runtime-${{ matrix.target }}.json
            codex-agent-runtime-node/build/reports/node-runtime-evidence/node-wasm-runtime-${{ matrix.target }}.json
          compression-level: 0
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          if-no-files-found: error
          overwrite: true
          name: codex-agent-ci-desktop-classifier-${{ matrix.target }}-${{ inputs.candidateCommit }}
          path: ${{ steps.classifier.outputs.archive }}
          compression-level: 0
          retention-days: 30
      - if: >-
          inputs.trustedCacheWriter && matrix.target == 'mingwX64' &&
          steps.build.outputs.konan-cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.konan
          key: ${{ steps.build.outputs.konan-cache-primary-key }}

  linux-arm64-supervisor:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ inputs.candidateCommit }}
      - uses: ./.github/actions/setup-kmp
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Compile only the supervisor on the ARM host
        run: ./gradlew :codex-agent-runtime-desktop:compileDesktopProcessSupervisor --stacktrace
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          if-no-files-found: error
          overwrite: true
          name: codex-agent-ci-linux-arm64-supervisor-${{ inputs.candidateCommit }}
          path: codex-agent-runtime-desktop/build/supervisor
          compression-level: 0
          retention-days: 1

  linux-arm64-cross-build:
    needs: linux-arm64-supervisor
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ inputs.candidateCommit }}
      - uses: ./.github/actions/setup-kmp
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: codex-agent-ci-portable-runtime-artifacts-${{ inputs.candidateCommit }}
          path: build/portable-runtime-artifacts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: codex-agent-ci-linux-arm64-supervisor-${{ inputs.candidateCommit }}
          path: build/desktop-supervisors
      - name: Cross-build one classifier and native test
        run: >-
          ./gradlew
          :codex-agent-runtime-desktop:linkDebugTestLinuxArm64
          :codex-agent-runtime-desktop:packageLinuxArm64AppServer
          -PcodexAgent.desktopSupervisorDirectory="$PWD/build/desktop-supervisors"
          --parallel --stacktrace
      - name: Stage one strict ARM execution bundle
        run: >-
          ./gradlew -p gradle/build-logic stageLinuxArm64RuntimeEvidenceBundle
          -PcodexAgent.candidateCommit="$CANDIDATE_COMMIT"
          -PcodexAgent.linuxArm64TestExecutable="$PWD/codex-agent-runtime-desktop/build/bin/linuxArm64/debugTest/test.kexe"
          -PcodexAgent.linuxArm64DistributionsDirectory="$PWD/codex-agent-runtime-desktop/build/distributions"
          -PcodexAgent.jvmRuntimeEvidenceRunner="$PWD/build/portable-runtime-artifacts/codex-agent-jvm-runtime-evidence-runner.zip"
          -PcodexAgent.nodeRuntimeEvidenceRunnerArchive="$PWD/build/portable-runtime-artifacts/codex-agent-node-runtime-evidence-runner.zip"
          -PcodexAgent.nodeWasmRuntimeEvidenceRunnerArchive="$PWD/build/portable-runtime-artifacts/codex-agent-node-wasm-runtime-evidence-runner.zip"
          -PcodexAgent.desktopDistributionManifest="$PWD/codex-agent-runtime-desktop/codex-app-server-distributions.json"
          -PcodexAgent.linuxArm64RuntimeEvidenceBundle="$PWD/build/linux-arm64-inputs/runtime.zip"
          --parallel --stacktrace
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          if-no-files-found: error
          overwrite: true
          name: codex-agent-ci-linux-arm64-execution-input-${{ inputs.candidateCommit }}
          path: build/linux-arm64-inputs/runtime.zip
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          if-no-files-found: error
          overwrite: true
          name: codex-agent-ci-desktop-classifier-linuxArm64-${{ inputs.candidateCommit }}
          path: codex-agent-runtime-desktop/build/distributions/*-app-server-linux-arm64.zip
          compression-level: 0
          retention-days: 30

  linux-arm64-runtime:
    needs: linux-arm64-cross-build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      RUNNER_OS: Linux
      RUNNER_ARCH: ARM64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ inputs.candidateCommit }}
      - uses: ./.github/actions/setup-kmp
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          node-version: "24.18.0"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: codex-agent-ci-linux-arm64-execution-input-${{ inputs.candidateCommit }}
          path: build/linux-arm64-inputs
      - name: Extract once and execute native, JVM, Node JS, and Node Wasm
        run: >-
          ./gradlew -p gradle/build-logic executeLinuxArm64RuntimeEvidenceBundle
          -PcodexAgent.candidateCommit="$CANDIDATE_COMMIT"
          -PcodexAgent.linuxArm64RuntimeEvidenceBundle="$PWD/build/linux-arm64-inputs/runtime.zip"
          -PcodexAgent.desktopEvidenceOutput="$PWD/codex-agent-runtime-desktop/build/reports/desktop-runtime-evidence/desktop-runtime-linuxArm64.json"
          -PcodexAgent.jvmEvidenceOutput="$PWD/codex-agent-runtime-desktop/build/reports/jvm-runtime-evidence/jvm-runtime-linuxArm64.json"
          -PcodexAgent.nodeEvidenceOutput="$PWD/codex-agent-runtime-node/build/reports/node-runtime-evidence/node-runtime-linuxArm64.json"
          -PcodexAgent.nodeWasmEvidenceOutput="$PWD/codex-agent-runtime-node/build/reports/node-runtime-evidence/node-wasm-runtime-linuxArm64.json"
          -PcodexAgent.javaExecutable=java --parallel --stacktrace
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          if-no-files-found: error
          overwrite: true
          name: codex-agent-ci-runtime-evidence-linuxArm64-${{ inputs.candidateCommit }}
          path: |
            codex-agent-runtime-desktop/build/reports/desktop-runtime-evidence/desktop-runtime-linuxArm64.json
            codex-agent-runtime-desktop/build/reports/jvm-runtime-evidence/jvm-runtime-linuxArm64.json
            codex-agent-runtime-node/build/reports/node-runtime-evidence/node-runtime-linuxArm64.json
            codex-agent-runtime-node/build/reports/node-runtime-evidence/node-wasm-runtime-linuxArm64.json
          compression-level: 0
          retention-days: 30
