name: Desktop Runtime Evidence

on:
  workflow_call:
    inputs:
      candidateCommit:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      candidateCommit:
        description: Exact candidate commit SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  windows-node-supervisor:
    runs-on: windows-2025
    timeout-minutes: 30
    environment: release-candidate
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidateCommit }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build package and verify the canonical Windows supervisor identity
        shell: bash
        run: >-
          ./gradlew :codex-agent-runtime-node:verifyWindowsNodeSupervisorPackage
          --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: codex-agent-node-windows-supervisor-identity
          path: codex-agent-runtime-node/build/windows-supervisor/windows-supervisor.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: codex-agent-node-windows-supervisor-package
          path: codex-agent-runtime-node/build/distributions/*-windows-supervisor.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  node-evidence-runner:
    needs: windows-node-supervisor
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release-candidate
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidateCommit }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v4
        with:
          name: codex-agent-node-windows-supervisor-identity
          path: build/node-windows-supervisor-identity
      - name: Build the complete portable Node evidence runner once
        shell: bash
        run: >-
          ./gradlew :codex-agent-runtime-node:packageNodeRuntimeEvidenceRunner
          "-PcodexAgent.windowsNodeSupervisorIdentityFile=$GITHUB_WORKSPACE/build/node-windows-supervisor-identity/windows-supervisor.json"
          --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: codex-agent-node-evidence-runner
          path: codex-agent-runtime-node/build/distributions/codex-agent-node-runtime-evidence-runner.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  runtime:
    name: ${{ matrix.target }} runtime
    needs: node-evidence-runner
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    environment: release-candidate
    env:
      DEVELOPER_DIR: ${{ matrix.developerDir }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macosArm64
            runner: macos-26
            task: recordMacosArm64DesktopRuntimeEvidence
            nodeTask: nodeRuntimeMacosArm64Test
            classifier: app-server-macos-arm64
            developerDir: /Applications/Xcode_26.6.app/Contents/Developer
          - target: macosX64
            runner: macos-26-intel
            task: recordMacosX64DesktopRuntimeEvidence
            nodeTask: nodeRuntimeMacosX64Test
            classifier: app-server-macos-x64
            developerDir: /Applications/Xcode_26.6.app/Contents/Developer
          - target: linuxX64
            runner: ubuntu-24.04
            task: recordLinuxX64DesktopRuntimeEvidence
            nodeTask: nodeRuntimeLinuxX64Test
            classifier: app-server-linux-x64
            developerDir: ""
          - target: mingwX64
            runner: windows-2025
            task: recordMingwX64DesktopRuntimeEvidence
            nodeTask: nodeRuntimeMingwX64Test
            classifier: app-server-windows-x64
            developerDir: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidateCommit }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v4
        with:
          name: codex-agent-node-evidence-runner
          path: build/node-evidence-runner
      - uses: actions/download-artifact@v4
        if: matrix.target == 'mingwX64'
        with:
          name: codex-agent-node-windows-supervisor-identity
          path: build/node-windows-supervisor-identity
      - uses: actions/download-artifact@v4
        if: matrix.target == 'mingwX64'
        with:
          name: codex-agent-node-windows-supervisor-package
          path: build/node-windows-supervisor-package
      - name: Print pinned Xcode version
        if: runner.os == 'macOS'
        run: xcodebuild -version
      - name: Print pinned Swift version
        if: runner.os == 'macOS'
        run: swift --version
      - name: Run and record the official app-server lifecycle smoke
        shell: bash
        run: >-
          ./gradlew :codex-agent-runtime-desktop:${{ matrix.task }}
          -PcodexAgent.candidateCommit=${{ inputs.candidateCommit }}
          -PcodexAgent.desktopEvidenceTarget=${{ matrix.target }}
          --no-daemon --stacktrace
      - name: Resolve the exact classifier built by the desktop smoke
        id: classifier
        shell: bash
        run: |
          shopt -s nullglob
          archives=("$GITHUB_WORKSPACE/codex-agent-runtime-desktop/build/distributions/"*-${{ matrix.classifier }}.zip)
          test "${#archives[@]}" -eq 1
          printf 'archive=%s\n' "${archives[0]}" >> "$GITHUB_OUTPUT"
      - name: Run and record the Node runtime lifecycle smoke
        if: matrix.target != 'mingwX64'
        shell: bash
        run: >-
          ./gradlew :codex-agent-runtime-node:${{ matrix.nodeTask }}
          -PcodexAgent.candidateCommit=${{ inputs.candidateCommit }}
          "-PcodexAgent.nodeRuntimeEvidenceRunnerArchive=$GITHUB_WORKSPACE/build/node-evidence-runner/codex-agent-node-runtime-evidence-runner.zip"
          "-PcodexAgent.nodeClassifierArchive=${{ steps.classifier.outputs.archive }}"
          --no-daemon --stacktrace
      - name: Resolve the transported Windows supervisor package
        if: matrix.target == 'mingwX64'
        id: windows-supervisor
        shell: bash
        run: |
          shopt -s nullglob
          packages=("$GITHUB_WORKSPACE/build/node-windows-supervisor-package/"*-windows-supervisor.zip)
          test "${#packages[@]}" -eq 1
          unzip -q "${packages[0]}" -d "$GITHUB_WORKSPACE/build/node-windows-supervisor"
          printf 'package=%s\n' "${packages[0]}" >> "$GITHUB_OUTPUT"
      - name: Run and record the Windows Node runtime lifecycle smoke
        if: matrix.target == 'mingwX64'
        shell: bash
        run: >-
          ./gradlew :codex-agent-runtime-node:${{ matrix.nodeTask }}
          -PcodexAgent.candidateCommit=${{ inputs.candidateCommit }}
          "-PcodexAgent.nodeRuntimeEvidenceRunnerArchive=$GITHUB_WORKSPACE/build/node-evidence-runner/codex-agent-node-runtime-evidence-runner.zip"
          "-PcodexAgent.nodeClassifierArchive=${{ steps.classifier.outputs.archive }}"
          "-PcodexAgent.nodeWindowsSupervisorExecutable=$GITHUB_WORKSPACE/build/node-windows-supervisor/codex-agent-node-windows-supervisor.exe"
          "-PcodexAgent.windowsNodeSupervisorIdentityFile=$GITHUB_WORKSPACE/build/node-windows-supervisor-identity/windows-supervisor.json"
          "-PcodexAgent.windowsNodeSupervisorPackage=${{ steps.windows-supervisor.outputs.package }}"
          --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: codex-agent-desktop-runtime-evidence-${{ matrix.target }}
          path: codex-agent-runtime-desktop/build/reports/desktop-runtime-evidence/desktop-runtime-${{ matrix.target }}.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: codex-agent-node-runtime-evidence-${{ matrix.target }}
          path: codex-agent-runtime-node/build/reports/node-runtime-evidence/node-runtime-${{ matrix.target }}.json
          if-no-files-found: error
          retention-days: 30

  linux-arm64-cross-build:
    needs: node-evidence-runner
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: release-candidate
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidateCommit }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v4
        with:
          name: codex-agent-node-evidence-runner
          path: build/node-evidence-runner
      - name: Cross-build the exact Linux ARM64 smoke inputs
        shell: bash
        run: >-
          ./gradlew
          :codex-agent-runtime-desktop:linkDebugTestLinuxArm64
          :codex-agent-runtime-desktop:packageLinuxArm64AppServer
          --no-daemon --stacktrace
      - name: Stage the hash-bound Linux ARM64 execution bundle
        shell: bash
        run: >-
          ./gradlew -p buildSrc stageLinuxArm64DesktopEvidenceBundle
          -PcodexAgent.candidateCommit=${{ inputs.candidateCommit }}
          "-PcodexAgent.linuxArm64TestExecutable=$GITHUB_WORKSPACE/codex-agent-runtime-desktop/build/bin/linuxArm64/debugTest/test.kexe"
          "-PcodexAgent.linuxArm64DistributionsDirectory=$GITHUB_WORKSPACE/codex-agent-runtime-desktop/build/distributions"
          "-PcodexAgent.linuxArm64ExecutionBundle=$GITHUB_WORKSPACE/build/linux-arm64-split/linux-arm64-execution.zip"
          --no-daemon --stacktrace
      - name: Stage the complete Node runner for Linux ARM64 execution
        shell: bash
        run: >-
          ./gradlew -p buildSrc stageLinuxArm64NodeRuntimeEvidenceBundle
          -PcodexAgent.candidateCommit=${{ inputs.candidateCommit }}
          "-PcodexAgent.nodeRuntimeEvidenceRunnerArchive=$GITHUB_WORKSPACE/build/node-evidence-runner/codex-agent-node-runtime-evidence-runner.zip"
          "-PcodexAgent.linuxArm64DistributionsDirectory=$GITHUB_WORKSPACE/codex-agent-runtime-desktop/build/distributions"
          "-PcodexAgent.linuxArm64NodeExecutionBundle=$GITHUB_WORKSPACE/build/linux-arm64-node-split/linux-arm64-node-execution.zip"
          --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: codex-agent-linux-arm64-execution-bundle
          path: build/linux-arm64-split/linux-arm64-execution.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: codex-agent-linux-arm64-node-execution-bundle
          path: build/linux-arm64-node-split/linux-arm64-node-execution.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  linux-arm64-runtime:
    needs: linux-arm64-cross-build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    environment: release-candidate
    env:
      RUNNER_OS: Linux
      RUNNER_ARCH: ARM64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidateCommit }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v4
        with:
          name: codex-agent-linux-arm64-execution-bundle
          path: build/linux-arm64-evidence-input
      - uses: actions/download-artifact@v4
        with:
          name: codex-agent-linux-arm64-node-execution-bundle
          path: build/linux-arm64-node-evidence-input
      - name: Execute and record the exact Linux ARM64 runtime smoke
        shell: bash
        run: >-
          ./gradlew -p buildSrc executeLinuxArm64DesktopEvidenceBundle
          -PcodexAgent.candidateCommit=${{ inputs.candidateCommit }}
          "-PcodexAgent.linuxArm64ExecutionBundle=$GITHUB_WORKSPACE/build/linux-arm64-evidence-input/linux-arm64-execution.zip"
          "-PcodexAgent.desktopEvidenceOutput=$GITHUB_WORKSPACE/build/reports/desktop-runtime-evidence/desktop-runtime-linuxArm64.json"
          "-PcodexAgent.desktopTestReportOutput=$GITHUB_WORKSPACE/build/test-results/linuxArm64SplitTest/TEST-linuxArm64Test.io.github.ciurlaro.codexmobile.appserver.runtime.DesktopCodexRuntimeTest.xml"
          --no-daemon --stacktrace
      - name: Execute and record the exact Linux ARM64 Node runtime smoke
        shell: bash
        run: >-
          ./gradlew -p buildSrc executeLinuxArm64NodeRuntimeEvidenceBundle
          -PcodexAgent.candidateCommit=${{ inputs.candidateCommit }}
          "-PcodexAgent.linuxArm64NodeExecutionBundle=$GITHUB_WORKSPACE/build/linux-arm64-node-evidence-input/linux-arm64-node-execution.zip"
          "-PcodexAgent.nodeEvidenceOutput=$GITHUB_WORKSPACE/build/reports/node-runtime-evidence/node-runtime-linuxArm64.json"
          "-PcodexAgent.nodeTestReportOutput=$GITHUB_WORKSPACE/build/test-results/linuxArm64NodeSplitTest/TEST-nodeRuntimeLinuxArm64Test.io.github.ciurlaro.codexmobile.appserver.runtime.NodeCodexRuntimeTest.xml"
          --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: codex-agent-desktop-runtime-evidence-linuxArm64
          path: build/reports/desktop-runtime-evidence/desktop-runtime-linuxArm64.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: codex-agent-node-runtime-evidence-linuxArm64
          path: build/reports/node-runtime-evidence/node-runtime-linuxArm64.json
          if-no-files-found: error
          retention-days: 30
