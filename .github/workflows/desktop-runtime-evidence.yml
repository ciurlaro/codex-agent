name: Desktop Runtime Evidence
on:
  workflow_call:
    inputs:
      candidateCommit:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      candidateCommit:
        description: Exact candidate commit SHA
        required: true
        type: string
permissions: {contents: read}
concurrency:
  group: desktop-runtime-evidence-${{ inputs.candidateCommit }}
  cancel-in-progress: false
env:
  CANDIDATE_COMMIT: ${{ inputs.candidateCommit }}
jobs:
  portable-runners:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ inputs.candidateCommit }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.18.0"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Build all portable evidence runners once
        run: >-
          ./gradlew
          :codex-agent-runtime-desktop:packageJvmRuntimeEvidenceRunner
          :codex-agent-runtime-node:packageNodeRuntimeEvidenceRunner
          :codex-agent-runtime-node:packageNodeWasmRuntimeEvidenceRunner
          --no-daemon --stacktrace
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          overwrite: true
          name: codex-agent-portable-runtime-evidence-runners
          path: |
            codex-agent-runtime-desktop/build/distributions/codex-agent-jvm-runtime-evidence-runner.zip
            codex-agent-runtime-node/build/distributions/codex-agent-node-runtime-evidence-runner.zip
            codex-agent-runtime-node/build/distributions/codex-agent-node-wasm-runtime-evidence-runner.zip
          compression-level: 0
          retention-days: 30
  runtime:
    name: ${{ matrix.target }} runtime
    needs: portable-runners
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env: { DEVELOPER_DIR: "${{ matrix.developerDir }}" }
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macosArm64
            runner: macos-26
            nativeTask: recordMacosArm64DesktopRuntimeEvidence
            jvmTask: recordJvmRuntimeMacosArm64Evidence
            nodeTask: nodeRuntimeMacosArm64Test
            wasmTask: nodeWasmRuntimeMacosArm64Test
            classifier: app-server-macos-arm64
            supervisor: codex-process-supervisor
            developerDir: /Applications/Xcode_26.6.app/Contents/Developer
          - target: macosX64
            runner: macos-26-intel
            nativeTask: recordMacosX64DesktopRuntimeEvidence
            jvmTask: recordJvmRuntimeMacosX64Evidence
            nodeTask: nodeRuntimeMacosX64Test
            wasmTask: nodeWasmRuntimeMacosX64Test
            classifier: app-server-macos-x64
            supervisor: codex-process-supervisor
            developerDir: /Applications/Xcode_26.6.app/Contents/Developer
          - target: linuxX64
            runner: ubuntu-24.04
            nativeTask: recordLinuxX64DesktopRuntimeEvidence
            jvmTask: recordJvmRuntimeLinuxX64Evidence
            nodeTask: nodeRuntimeLinuxX64Test
            wasmTask: nodeWasmRuntimeLinuxX64Test
            classifier: app-server-linux-x64
            supervisor: codex-process-supervisor
            developerDir: ""
          - target: mingwX64
            runner: windows-2025
            nativeTask: recordMingwX64DesktopRuntimeEvidence
            jvmTask: recordJvmRuntimeMingwX64Evidence
            nodeTask: nodeRuntimeMingwX64Test
            wasmTask: nodeWasmRuntimeMingwX64Test
            classifier: app-server-windows-x64
            supervisor: codex-process-supervisor.exe
            developerDir: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ inputs.candidateCommit }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.18.0"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: codex-agent-portable-runtime-evidence-runners
          path: .
      - uses: ./.github/actions/setup-msvc
      - name: Record native evidence and build one classifier with its supervisor
        shell: bash
        run: >-
          ./gradlew :codex-agent-runtime-desktop:${{ matrix.nativeTask }}
          -PcodexAgent.candidateCommit="$CANDIDATE_COMMIT"
          -PcodexAgent.desktopEvidenceTarget=${{ matrix.target }}
          --no-daemon --stacktrace
      - name: Resolve the classifier and preserve its exact supervisor
        id: classifier
        shell: bash
        run: |
          shopt -s nullglob
          archives=(codex-agent-runtime-desktop/build/distributions/*-${{ matrix.classifier }}.zip)
          test "${#archives[@]}" -eq 1
          supervisor="codex-agent-runtime-desktop/build/supervisor/${{ matrix.target }}/${{ matrix.supervisor }}"
          test -x "$supervisor"
          mkdir -p "build/desktop-supervisors/${{ matrix.target }}"
          cp "$supervisor" "build/desktop-supervisors/${{ matrix.target }}/${{ matrix.supervisor }}"
          printf 'archive=%s/%s\n' "$PWD" "${archives[0]}" >> "$GITHUB_OUTPUT"
      - name: Run JVM, Node JS, and Node Wasm against that classifier
        shell: bash
        run: >-
          ./gradlew
          :codex-agent-runtime-desktop:${{ matrix.jvmTask }}
          :codex-agent-runtime-node:${{ matrix.nodeTask }}
          :codex-agent-runtime-node:${{ matrix.wasmTask }}
          -PcodexAgent.candidateCommit="$CANDIDATE_COMMIT"
          -PcodexAgent.desktopEvidenceTarget=${{ matrix.target }}
          -PcodexAgent.jvmClassifierArchive="${{ steps.classifier.outputs.archive }}"
          -PcodexAgent.jvmRuntimeEvidenceRunner="$PWD/codex-agent-runtime-desktop/build/distributions/codex-agent-jvm-runtime-evidence-runner.zip"
          -PcodexAgent.nodeClassifierArchive="${{ steps.classifier.outputs.archive }}"
          -PcodexAgent.nodeRuntimeEvidenceRunnerArchive="$PWD/codex-agent-runtime-node/build/distributions/codex-agent-node-runtime-evidence-runner.zip"
          -PcodexAgent.nodeWasmRuntimeEvidenceRunnerArchive="$PWD/codex-agent-runtime-node/build/distributions/codex-agent-node-wasm-runtime-evidence-runner.zip"
          -PcodexAgent.desktopDistributionManifest="$PWD/codex-agent-runtime-desktop/codex-app-server-distributions.json"
          --no-daemon --stacktrace
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          overwrite: true
          name: codex-agent-runtime-evidence-${{ matrix.target }}
          path: |
            codex-agent-runtime-desktop/build/reports/desktop-runtime-evidence/desktop-runtime-${{ matrix.target }}.json
            codex-agent-runtime-desktop/build/reports/jvm-runtime-evidence/jvm-runtime-${{ matrix.target }}.json
            codex-agent-runtime-node/build/reports/node-runtime-evidence/node-runtime-${{ matrix.target }}.json
            codex-agent-runtime-node/build/reports/node-runtime-evidence/node-wasm-runtime-${{ matrix.target }}.json
            build/desktop-supervisors/${{ matrix.target }}
          compression-level: 0
          retention-days: 30
  linux-arm64-supervisor:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ inputs.candidateCommit }}
      - name: Compile only the supervisor on the ARM host
        run: |
          test "$RUNNER_OS" = Linux && test "$RUNNER_ARCH" = ARM64
          output=build/desktop-supervisors/linuxArm64/codex-process-supervisor
          mkdir -p "${output%/*}"
          cc -std=c11 -D_POSIX_C_SOURCE=200809L -O2 -Wall -Wextra -Werror \
            codex-agent-runtime-desktop/native/supervisor/codex_process_supervisor.c -o "$output"
          chmod 755 "$output"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          overwrite: true
          name: codex-agent-linux-arm64-supervisor-input
          path: build/desktop-supervisors
          compression-level: 0
          retention-days: 1
  linux-arm64-cross-build:
    needs: [portable-runners, linux-arm64-supervisor]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ inputs.candidateCommit }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: codex-agent-portable-runtime-evidence-runners
          path: .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: codex-agent-linux-arm64-supervisor-input
          path: build/desktop-supervisors
      - name: Cross-build one classifier and native test
        run: >-
          ./gradlew
          :codex-agent-runtime-desktop:linkDebugTestLinuxArm64
          :codex-agent-runtime-desktop:packageLinuxArm64AppServer
          -PcodexAgent.desktopSupervisorDirectory="$PWD/build/desktop-supervisors"
          --no-daemon --stacktrace
      - name: Stage the three exact ARM execution bundles
        run: >-
          ./gradlew -p buildSrc
          stageLinuxArm64DesktopEvidenceBundle
          stageLinuxArm64JvmEvidenceBundle
          stageLinuxArm64NodeRuntimeEvidenceBundle
          -PcodexAgent.candidateCommit="$CANDIDATE_COMMIT"
          -PcodexAgent.linuxArm64TestExecutable="$PWD/codex-agent-runtime-desktop/build/bin/linuxArm64/debugTest/test.kexe"
          -PcodexAgent.linuxArm64DistributionsDirectory="$PWD/codex-agent-runtime-desktop/build/distributions"
          -PcodexAgent.jvmRuntimeEvidenceRunner="$PWD/codex-agent-runtime-desktop/build/distributions/codex-agent-jvm-runtime-evidence-runner.zip"
          -PcodexAgent.nodeRuntimeEvidenceRunnerArchive="$PWD/codex-agent-runtime-node/build/distributions/codex-agent-node-runtime-evidence-runner.zip"
          -PcodexAgent.nodeWasmRuntimeEvidenceRunnerArchive="$PWD/codex-agent-runtime-node/build/distributions/codex-agent-node-wasm-runtime-evidence-runner.zip"
          -PcodexAgent.desktopDistributionManifest="$PWD/codex-agent-runtime-desktop/codex-app-server-distributions.json"
          -PcodexAgent.linuxArm64ExecutionBundle="$PWD/build/linux-arm64-inputs/desktop.zip"
          -PcodexAgent.linuxArm64JvmExecutionBundle="$PWD/build/linux-arm64-inputs/jvm.zip"
          -PcodexAgent.linuxArm64NodeExecutionBundle="$PWD/build/linux-arm64-inputs/node.zip"
          --no-daemon --stacktrace
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          overwrite: true
          name: codex-agent-linux-arm64-execution-inputs
          path: |
            build/linux-arm64-inputs
            build/desktop-supervisors
          compression-level: 0
          retention-days: 1
  linux-arm64-runtime:
    needs: linux-arm64-cross-build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      RUNNER_OS: Linux
      RUNNER_ARCH: ARM64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ inputs.candidateCommit }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.18.0"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: codex-agent-linux-arm64-execution-inputs
          path: build
      - name: Execute native, JVM, Node JS, and Node Wasm without root KMP configuration
        run: >-
          ./gradlew -p buildSrc
          executeLinuxArm64DesktopEvidenceBundle
          executeLinuxArm64JvmEvidenceBundle
          executeLinuxArm64NodeRuntimeEvidenceBundle
          -PcodexAgent.candidateCommit="$CANDIDATE_COMMIT"
          -PcodexAgent.linuxArm64ExecutionBundle="$PWD/build/linux-arm64-inputs/desktop.zip"
          -PcodexAgent.desktopEvidenceOutput="$PWD/codex-agent-runtime-desktop/build/reports/desktop-runtime-evidence/desktop-runtime-linuxArm64.json"
          -PcodexAgent.linuxArm64JvmExecutionBundle="$PWD/build/linux-arm64-inputs/jvm.zip"
          -PcodexAgent.javaExecutable=java
          -PcodexAgent.jvmEvidenceOutput="$PWD/codex-agent-runtime-desktop/build/reports/jvm-runtime-evidence/jvm-runtime-linuxArm64.json"
          -PcodexAgent.linuxArm64NodeExecutionBundle="$PWD/build/linux-arm64-inputs/node.zip"
          -PcodexAgent.desktopDistributionManifest="$PWD/codex-agent-runtime-desktop/codex-app-server-distributions.json"
          -PcodexAgent.nodeEvidenceOutput="$PWD/codex-agent-runtime-node/build/reports/node-runtime-evidence/node-runtime-linuxArm64.json"
          -PcodexAgent.nodeWasmEvidenceOutput="$PWD/codex-agent-runtime-node/build/reports/node-runtime-evidence/node-wasm-runtime-linuxArm64.json"
          --no-daemon --stacktrace
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          overwrite: true
          name: codex-agent-runtime-evidence-linuxArm64
          path: |
            codex-agent-runtime-desktop/build/reports/desktop-runtime-evidence/desktop-runtime-linuxArm64.json
            codex-agent-runtime-desktop/build/reports/jvm-runtime-evidence/jvm-runtime-linuxArm64.json
            codex-agent-runtime-node/build/reports/node-runtime-evidence/node-runtime-linuxArm64.json
            codex-agent-runtime-node/build/reports/node-runtime-evidence/node-wasm-runtime-linuxArm64.json
            build/desktop-supervisors/linuxArm64
          compression-level: 0
          retention-days: 30
